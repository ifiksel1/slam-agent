    alt_fix: "Not needed now, but if a denser space starves it again: raise MP_PROC_NUM (OpenMP threads) in FAST-LIO CMakeLists 3->~8 to use the idle cores (laserMapping was ~293% CPU / 3 of 12 cores) -- keeps full resolution, needs rebuild+rebake."
    persistence: "All bind-mounted config; image already baked (flight_recorder+ch9 banners = slam-system:latest 5e076c1628b9); NO rebuild needed. Reboot restores everything incl FC link. Changelog: CHANGELOG.md (new)."
    next: "Optional: run auto-diff on manhole_flight (log 97, dynamic profile) to confirm it holds under aggressive climb/descent and to test whether vibration is downstream."
    priority: high

  - id: P20
    title: "Manhole-entrance altitude excursions -- RESOLVED: surface tracking off glitchy rangefinder"
    status: RESOLVED
    detail: >
      manhole_flight (log 97 + bag): took off, climbed to the manhole entrance (~4.4m) fine, then hit
      uncommanded altitude drop/climb (~1-1.5m) while trying to hold at the opening; aborted, did not enter.
      Flew into the SAME manhole fine in STABILIZE (no logs) -- the natural experiment that isolates the fault
      to a Loiter-only control path.
      RULED OUT (all with data): SLAM/vision (accurate; smooth, no jumps; XKF3 innovations ~0; /Odometry held
      20Hz -- the P19 fix stuck); vibration (VibeZ 15.6 low); EKF velocity-rejection (0%); IMU lane switches (0);
      attitude-thrust coupling (tilt 2-9deg); thrust saturation (motors ~1750/1965); battery sag (gradual only);
      throttle-stick trim (user confirms calibrated; centered stick coincided with a COMMANDED descent);
      inner-loop PID (DCRt~=CRt and PSCD TVD~=VD to +-4cm/s -> inner controller HEALTHY).
      CONFIRMED ROOT CAUSE: ArduPilot SURFACE TRACKING was driving the altitude TARGET off the downward
      rangefinder. Params at flight time: SURFTRAK_MODE=1, WPNAV_RFND_USE=1, RNGFND1_TYPE=10 ORIENT=25(down),
      MAX_CM=5000. This is SEPARATE from the EKF height source (EK3_SRC1_POSZ=6 vision, EK3_RNG_USE_HGT=-1 --
      user correctly 'not using rangefinder' for the EKF, but surface tracking is a different active consumer).
      Over the open shaft the rangefinder glitched (RFND status flickered NoData/OutOfRange/Good, 0-5m while
      hovering at 4.4m); surface tracking kept dis/re-engaging and latched garbage terrain targets. DIRECT PROOF:
      CTUN.DSAlt (surface-tracking target) drove CTUN.DAlt (altitude target) -- DAlt converged to DSAlt at both
      drops (4.4->3.0, then 3.5->2.0); ST engaged 79% of the first drop; SAlt terrain-est 50% noisier at entrance
      (1.66 vs 1.10m). Loiter-only -> Stabilize flew in fine (no surface tracking). NOT PID, NOT SLAM, NOT airframe.
    patch: "FC param SURFTRAK_MODE=0 (stop rangefinder from moving the altitude target); keep EK3_SRC1_POSZ=6 (vision). Belt-and-suspenders WPNAV_RFND_USE=0 also recommended for nav modes."
    validated: >
      (2026-07-08) USER APPLIED SURFTRAK_MODE=0 and re-flew -- the changes WORKED: manhole entrance
      altitude now holds in Loiter (no uncommanded drop/climb), vision-only vertical loop stable.
      Confirms the surface-tracking root cause. SURFTRAK_MODE=0 alone was sufficient to resolve.
    flight_archive: "office_test(94), before_problem_resolution(95), hover_flight_after_problem_resolution(96), manhole_flight(97) -- each dir on thumbdrive has bag+.bin, xcorr=1.000 verified. CHANGELOG.md at drive root."
    next: "Done. (Optional: capture a post-fix manhole flight via flight_recorder for the archive.)"
    priority: high

  - id: P21
    title: "CH9 restart never reached controller -- FC not streaming RC to companion (SR0_RC_CHAN=0)"
    status: RESOLVED
    detail: >
      User reported no GCS banners on the SIYI UniRC 7 Pro when flipping CH9 to restart. Isolated the chain:
      drift_monitor DOES publish 4 banners to /mavros/statustext/send and mavros relays them (confirmed a manual
      test banner reached the SIYI). Real cause: /mavros/rc/in was EMPTY -- the FC was not streaming RC_CHANNELS
      to the companion/USB link (SERIAL0). Root cause param: SR0_RC_CHAN=0 (SR1_RC_CHAN=2 was fine -> SIYI had RC,
      mavros did not). So CH9 flips never reached drift_monitor -> failover never fired -> no banners generated.
      NOT related to the OF-failover code (banner path proven working).
    patch: >
      FC param SR0_RC_CHAN 0->10 (persists in FC EEPROM). BUT the param alone is insufficient: ArduPilot latches
      SR rates at GCS-connect, so mavros must REQUEST the stream after each (re)connect. Added a permanent
      keepalive in drift_monitor.py: on every /mavros/state connect it calls /mavros/set_stream_rate
      (STREAM_RC_CHANNELS=3 @ rc_stream_rate Hz). Params request_rc_stream=true, rc_stream_rate=10 in the launch.
    validated: >
      (2026-07-23) Verified live: real CH9 flip fired the full failover sequence (FAILOVER -> EKF src OF(SRC2) ->
      3.85s health gap = SLAM restart -> back to SRC1). Keepalive proven on a container recreate: RC auto-streamed
      at 10Hz with NO manual kick. drift_monitor.py now bind-mounted (docker-compose.yml) + recreate-tested.
    priority: high

  - id: P22
    title: "Switchable OF/LAND restart mode + phone web UI + confined-space FAST-LIO param sweep"
    status: RESOLVED
    detail: >
      (1) restart_mode: added a param (of|land) to drift_monitor.py. Both triggers (drift CRITICAL + CH9) share
      _execute_restart() which branches: 'of' = EKF source failover SLAM(SRC1)->OF(SRC2), switch back on recovery
      (NO flight-mode change); 'land' = set_mode LAND (code-complete, NEVER fired/armed during testing).
      (2) ~/Documents/switch_restart_mode.sh {of|land|--status} -- edits launch file (persistent) + live rosparam
      + restarts drift_monitor node (~5s, no full pipeline bounce). Verified of<->land both ways.
      (3) ~/Documents/mode_switch_server.py -- zero-dep stdlib web UI (black/yellow Revolute theme #FDD300/#000/#CCC),
      auto-starts via systemd slam-mode-web (enabled), served at STATIC URL http://revolute.local:8088 (mDNS/avahi,
      follows the machine across hotspots). Shows live mode + state; LAND button confirms.
      (4) Confined-space param sweep: 35 offline replays (7 configs S0..S6 x 5 newest flight bags) on isolated ROS
      master :11312 (never touched live pipeline/FC). Determinism <1%. Harness: scripts/replay/sweep_all.sh,
      sweep_run_one.sh, analyze_sweep.py.
    findings: >
      Finer voxel (S0 0.35/pf3/it3 -> S6 0.15/pf1/it4) DOUBLES average observability (matched +135%, eig_min +140%
      on starved bags) BUT does NOT reduce drift risk: m_min and crit-exposure FLAT across all configs; worst-case
      scan is byte-identical across S0/S3/S6 (matched=54/81, feats_down=354/424) because it is INPUT STARVATION
      (raw scan had ~no points at that viewpoint) -- unfixable by any downsample param. Confirmed root cause is
      sensing/geometry, not processing. Max sub-floor DWELL only 3-4 scans (~0.2s), p5=242-282 (well above 150
      floor) -> starvation was brief/borderline sub-threshold; k_crit=5 hysteresis well-tuned. Compute rises 2-3x
      by S6 (offline ms only, directional). BEST BUCKET = S3 (0.25/0.25/pf2/it4): +28% matched/+31% eig_min at
      compute ~= baseline (the knee). NOTE: S3 raises AVERAGE margin only; it does NOT reduce drift events.
    triggers_analysis: >
      Separate: matched_pts<150 is the primary/earliest drift detector; eig_min<5000 is near dead-weight (could
      raise to ~15-20k as free insurance for corridor/degenerate-axis geometry, zero false positives on 8 bags).
      Condition number (eig_min/eig_max) LAGS matched and misses events -> classifier only, NOT a trigger.
      matched+eig already OR-combined (design). Better worst-case metric than m_min = max sub-floor DWELL (says
      'how long starved', distinguishes survivable blips from sustained). NO trigger changes applied (user pinned).
    persistence: "restart_mode/RC params in bind-mounted launch (git-tracked); drift_monitor.py bind-mounted + recreate-verified; SR0_RC_CHAN in FC EEPROM; web UI systemd-enabled. NONE pushed to fork yet (docker_src gitignored)."
    docs: "docs/DRIFT_MONITOR_FLOW.md (ASCII flowchart). Sweep outputs: /mnt/usb/replay_sweep/<config>/*.bag (35). Effective config snapshots: ~/Documents/hesai_jt128_effective.yaml + _current.yaml."
    profiles_decided: >
      (2026-07-23) THREE env profiles chosen (surf/map, point_filter_num, max_iteration; constants blind 0.4,
      det_range 100, cube 300 unless noted). Logic: fine voxel is affordable where input is SPARSE and
      unaffordable where DENSE -> inverts onto environment.
        1. OPEN space           = S0 baseline (0.35 / 3 / 3) -- dense input, compute-bound, coarse holds 20Hz.
        2. TIGHT / small rooms   = S3          (0.25 / 2 / 4) -- moderate density, the knee (+28% matched @ ~base compute).
        3. CONFINED / rounded / corners = S4    (0.22 / 2 / 4) -- sparse input, extract max, still real-time (~84ms max).
      Rejected S5/S6 (pf1): 2-3x compute tail for gains that DON'T touch the drift floor. NEVER run tight/confined
      (fine-voxel) config in open/dense space -> would blow the compute budget. Optional untested: lower
      det_range/cube for small rooms to save compute+RAM. Confined config raises AVERAGE margin only, NOT drift-event rate.
    next: >
      Optional: (a) build switch_slam_profile.sh {open|tight|confined} = S0/S3/S4 (restart-based, like the OF/LAND
      switch; deferred pending user go); (b) save docs/CONFINED_SPACE_SWEEP_RESULTS.md; (c) push drift_monitor.py
      to the fork; (d) real confined-space drift fix is PHYSICAL (sensor FOV/orientation, flight profile), not params.
    priority: medium

