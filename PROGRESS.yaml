# SYSTEM FACTS (stable reference)
# -----------------------------------------------------------------------------
system:
  nuc:
    host: "revolute@192.168.0.107"
    hostname: "revolute"
    ssh: "enabled (port 22); ufw allows ssh"
    lan_ip: "192.168.0.107"
  container:
    name: "slam-hesai-fastlio"
    image: "slam-system:latest"
    image_id_current: "3173572c612b   # 2026-06-12: bridge yaw-datum + re-stamp + flip_position_y, laserMapping eigenvalues. (prior: 6849d0d18a89 -> e4b85ce4496e -> 3173572c612b)"
    network_mode: "host"
    ros_distro: "noetic"
  repo:
    path: "/home/revolute/Documents/slam-agent"
    launch_file: "config/fastlio_to_fc.launch   # bind-mounted via ./config -> container"
    config_mount: "./config -> /root/slam_ws/src/FAST_LIO_SLAM/FAST_LIO_SLAM/FAST-LIO/config (rw)"
    vendored_src: "docker_src/FAST_LIO_SLAM/FAST_LIO_SLAM/FAST-LIO/src/laserMapping.cpp"
    vendored_src_note: "docker_src/ is GITIGNORED (private fork convention). Source patch persists on disk + in image, NOT in git."
  systemd:
    - "slam-container.service   # docker compose up -d slam-system (oneshot, RemainAfterExit)"
    - "slam-fastlio.service     # docker exec roslaunch fastlio_to_fc.launch"
    note: "systemctl start/restart needs root (no passwordless sudo in agent shell). Reboot to apply."
  sensor: "Hesai JT128 LiDAR (publishes /lidar_points + /lidar_imu directly)"
  flight_controller: "mRo Pixracer Pro over USB CDC-ACM /dev/ttyACM0 @921600, MAVROS, ArduPilot"
  fc_ekf_sources: >
    POSXY=6 POSZ=6 YAW=6 (ExternalNav/vision). GPS1_TYPE=0, no RC source-switch.
    VELXY/VELZ: CURRENTLY = 6 (user set back 2026-06-12 end-of-session) BUT the VALIDATED value is 0.
    See T13: VELXY/VELZ=6 with NO velocity source published = the runaway root cause. 0 (None) fixed it.
    6 only works if velocity is published (FAST-LIO twist is currently zero) -> otherwise runaway returns under motion.
  fc_frame: "/mavros/local_position/pose = ENU world frame (x=East, y=North, z=Up), ~50Hz. NOT body-relative. mavros auto-converts ArduPilot NED<->ROS ENU. Body=FLU (fwd+x,left+y,up+z) per REP-103; yaw CCW-positive, 0=East."
  fc_baud: "fcu_url /dev/ttyACM0:921600 (USB CDC-ACM -> baud is cosmetic, USB ignores it). timesync locked ~3ms RTT."
  fc_params_dump: "config/fc_ekf_params.parm  # captured FC params for reflash reproducibility (NOTE: lists VELXY/VELZ=0, the validated value)"
  fc_prearm: "PreArm: PRX1: No Data (PRX1_TYPE=2 MAVLink proximity, unfed) + RC_RECEIVER unhealthy (no TX). Block arming; not fixed."
  fc_audit_deferred: "COMPASS_USE=1 (consider 0 for vision-yaw indoors); EK3_SRC1_POSZ=6 vision height (consider 1=baro); VISO_DELAY_MS=50 (estimate, validate); no loop-closure node (SC-PGO not launched -> drift)."

