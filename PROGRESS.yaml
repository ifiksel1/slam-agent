      is self-inconsistent (mirrors position not orientation). RECOMMENDED: disable it; if a real lateral
      mirror exists, fix it consistently in the rotation_matrix/extrinsic (position+orientation together).
      User chose to KEEP it for now. Toggle ~flip_position_y:=false to revert.
    files: ["docker_src/.../FAST-LIO/src/fastlio_mavros_bridge.py"]

