# -----------------------------------------------------------------------------
# TOPICS (current live state, verified post-reboot)
# -----------------------------------------------------------------------------
topics:
  inputs:
    - {name: /lidar_points, freq_hz: 20,  role: "raw LiDAR geometry input"}
    - {name: /lidar_imu,    freq_hz: 430, role: "IMU propagation input"}
  core:
    - {name: /Odometry,                  freq_hz: 20, role: "pose + covariance + twist"}
    - {name: /path,                      freq_hz: 2,  role: "trajectory history"}
    - {name: /mavros/vision_pose/pose,   freq_hz: 20, role: "pose sent to FC (consumer)"}
  map_and_registration:
    - {name: /Laser_map,             freq_hz: 1,  bw: "243 KB/s", role: "internal ikd-tree map (ghosting=registration broken)"}
    - {name: /cloud_registered,      freq_hz: 20, bw: "20.75 MB/s", role: "current scan in world frame (HEAVY - not for wifi)"}
    - {name: /cloud_registered_body, freq_hz: 20, bw: "20.27 MB/s", role: "current scan body frame (HEAVY - not for wifi)"}
    - {name: /cloud_registered_lite, freq_hz: 5,  bw: "443 KB/s",  role: "downsampled scan for remote viz"}
    - {name: /cloud_effected,        freq_hz: 20, bw: "504 KB/s",  role: "matched points = degeneracy visual (BEST indicator)"}
  diagnostics:
    - name: /fastlio_health
      freq_hz: 20
      type: std_msgs/Float32MultiArray
      data: ["[0]=matched_pts (drop=degeneracy)", "[1]=mean_residual (spike=bad fit)", "[2]=ekf_update_ms (->50=overload)", "[3]=input_pts", "[4]=HtDH_eig_min (small=degenerate axis)", "[5]=HtDH_eig_mid", "[6]=HtDH_eig_max"]
      note: "eig_* added T12; live on the post-rebuild image. Old running binary still publishes 4 elements until reboot."
  bridge:
    - {name: "foxglove_bridge", port: 8765, status: "listening 0.0.0.0:8765"}

# -----------------------------------------------------------------------------
# REMOTE VISUALIZATION
# -----------------------------------------------------------------------------
remote_viz:
  bridge_url: "ws://192.168.0.107:8765"
  ssh_tunnel: "ssh -fN -L 8765:localhost:8765 revolute@192.168.0.107   # then connect ws://localhost:8765"
  reason_for_tunnel: "wifi bandwidth-limited; ufw may block 8765; tunnel rides port 22"
  fixed_frame: "camera_init"
  light_topic_set_total: "~11 Mbit/s (fits wifi)"
  light_topics: [/Laser_map, /cloud_registered_lite, /cloud_effected, /path, /Odometry, /fastlio_health]
  do_not_subscribe: [/cloud_registered, /cloud_registered_body]  # ~330 Mbit/s combined, saturates link
  remote_machine:
    host: "shannon-mini (Ubuntu 22.04)"
    foxglove: "Studio v2.54.0 (portable extract)"
    layout: "/home/shannon-mini/Documents/fastlio_slam_layout.json"

# -----------------------------------------------------------------------------
# FAILURE-ANALYSIS REFERENCE (how to read the topics)
# -----------------------------------------------------------------------------
failure_signatures:
  rule: "plots(health[0],[1] + covariance)=WHEN ; 3D clouds(Laser_map,cloud_effected)=HOW ; inputs=sensor-vs-algorithm"
  modes:
    geometric_degeneracy: "health[0] DOWN + covariance UP + cloud_effected sparse/planar, inputs OK"
    sensor_dropout:        "lidar_points DOWN -> health[3] DOWN -> health[0] DOWN (geometry fine)"
    fast_motion_imu_sat:   "IMU norm spike + health[1] UP + registered scan blurs vs map"
    compute_overload:      "health[2] -> 50 ms + odometry stutter"
    drift_accumulation:    "Laser_map ghosts + path z-drift + slow covariance creep"
  cloud_effected_visual:
    good: "dense, wraps sensor, normals span 3 axes (2 perp walls + floor), stable"
    bad:  "sparse/collapsing, single plane/line, one-sided, flickering"
    trap: "long corridor = HIGH count but degenerate (along-axis unconstrained). Count alone lies; check spatial spread."

