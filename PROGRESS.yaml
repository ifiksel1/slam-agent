# SYSTEM FACTS (stable reference)
# -----------------------------------------------------------------------------
system:
  nuc:
    host: "revolute@192.168.0.107"
    hostname: "revolute"
    ssh: "enabled (port 22); ufw allows ssh"
    lan_ip: "192.168.0.107"
  container:
    name: "slam-hesai-fastlio"
    image: "slam-system:latest"
    image_id_current: "5fb89f2fae6f   # 2026-06-21: + ExternalNav VELOCITY baked in (laserMapping /Odometry twist from IEKF vel; bridge -> /mavros/vision_speed/speed_vector). (history: 6849d0d18a89 -> e4b85ce4496e -> 3173572c612b -> 5e5a726b8610 -> 825038356ce3 -> 5fb89f2fae6f)"
    network_mode: "host"
