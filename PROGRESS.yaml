    files: ["docker_src/.../FAST-LIO/src/fastlio_mavros_bridge.py"]

  - id: T11
    title: "P6 root cause + fix: vision timestamp on wrong clock (motion rejection)"
    status: done
    detail: >
      Root cause of forward-motion runaway: the Hesai LiDAR stamps scans on its INTERNAL clock
      (~23750s uptime); FAST-LIO + bridge forwarded that to /mavros/vision_pose/pose, ~1.78e9 s
      (~56yr) off the system/FC clock. mavros timesync only syncs the SYSTEM clock to the FC, so
      the sensor-clock stamp converted to garbage FC-time -> vision mis-timed -> EKF rejects it
      under motion (timing matters), tolerates at rest. Measured in-container latency: lidar->odom
      ~14ms, odom->vision ~0.3ms (bridge negligible).
      FIX (3 parts, all live):
        (1) Bridge re-stamps vision_pose with rospy.Time.now() (system clock). Param ~restamp_system_time (default true).
        (2) VISO_DELAY_MS 60 -> 50 on FC (trims residual scan-period + processing latency). Persisted to EEPROM.
        (3) Verified mavros timesync LOCKED: rtt ~3ms, est_offset stable <1ms. vision_pose stamp age now ~7ms (was ~1.78e12ms).
      Still TODO: behavioral bench run to confirm translations track without runaway.
    files: ["docker_src/.../FAST-LIO/src/fastlio_mavros_bridge.py"]

  - id: T12
    title: "Add HtDH translation eigenvalues to /fastlio_health (degeneracy metric)"
    status: done
    detail: >
      laserMapping.cpp h_share_model: h_x cols 0-2 = plane normals = translation Jacobian. Compute
      M3D HtDH = Hp^T Hp / LASER_POINT_COV, SelfAdjointEigenSolver -> ascending eigenvalues stored
      in global V3D hdh_eig_pos. /fastlio_health extended 4 -> 7 floats: [...,4=eig_min,5=eig_mid,6=eig_max].
      eig_min small => degenerate translation axis (corridor/tunnel). Compiles clean (catkin build fast_lio OK).
      Live on next image (rebuild launched this session).
    files: ["docker_src/.../FAST-LIO/src/laserMapping.cpp"]

  - id: T13
    title: "ROOT CAUSE of the motion runaway: EK3_SRC1_VELXY/VELZ=6 with no velocity source"
    status: "fix-validated-then-user-reverted"
    detail: >
      THE big find. EK3_SRC1_VELXY=6 & VELZ=6 (ExternalNav velocity) but NOTHING publishes velocity
      (FAST-LIO /Odometry twist is all-zero; bridge sends position-only vision_pose). So the EKF had
      no velocity measurement -> dead-reckoned velocity on the FC IMU -> position ran away during ANY
      motion, snapped back at rest. SET VELXY=0 & VELZ=0 (None) -> at-rest wander 0.25m -> 0.012m (20x),
      and run-3 bench showed forward TRACKING+HOLDING cleanly (gap 0.10m @0.6m/s) - runaway gone.
      ** END OF SESSION: user asked to set VELXY/VELZ back to 6 ** (current live state = 6).
      With 6 and no velocity published, the runaway WILL return under motion. To make 6 valid, must
      publish velocity (FAST-LIO twist is zero): (a) bridge differentiates position -> /mavros/vision_speed/speed_vector,
      or (b) patch laserMapping to fill twist. NEITHER done yet. Validated-good value remains 0.
    files: ["FC params (EEPROM): EK3_SRC1_VELXY, EK3_SRC1_VELZ"]

  - id: T14
    title: "NUC/FAST-LIO sweep fixes: pcd_save off, cube_side_length 1000->300"
    status: done
    detail: >
      Full NUC-side audit. Found pcd_save_en=true (interval=-1) writing multi-GB PCDs (3.6GB found) with
      periodic blocking disk I/O that stalls the SLAM loop + RAM-growth risk -> set pcd_save_en=false in
      config/hesai_jt128.yaml. Found cube_side_length=1000 (local map never trims -> unbounded ikd-tree on
      long runs) -> set 300 in config/fastlio_to_fc.launch. Both bind-mounted (reboot-persistent), applied
      via docker restart. Verified clean: scan_line=128, deskew correct (per-pt time 0..0.05s), IMU good
      (accel 9.804+/-0.019), NTP synced, no thermal/throttle. Filter sizes 0.5m (coarse, tuning lever).
    files: ["config/hesai_jt128.yaml", "config/fastlio_to_fc.launch"]

  - id: T15
    title: "Bridge flip_position_y added (lateral-inversion patch) - SUSPECTED HARMFUL"
    status: "applied-but-suspect"
    detail: >
      To address an observed LEFT->-y reading (should be +y per REP-103), added ~flip_position_y (default true)
      to fastlio_mavros_bridge.py: negates ONLY published position.y, leaving x/z/orientation untouched.
      Baked into image 3173572c612b. BUT: evidence it's HARMFUL under motion - it negates vision position-y
