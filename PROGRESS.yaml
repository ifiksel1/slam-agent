  - id: T18
    title: "Attitude (RPY) bench validation -> SLAM orientation is a clean 3-axis cyclic PERMUTATION (frame, not error)"
    status: done
    detail: >
      Static bench, motors DISARMED. Sequence: level home -> roll right -> home -> roll left -> home ->
      pitch fwd -> home -> pitch back -> home (yaw not exercised). Recorded logs/bench_attitude.bag (66s),
      analyzed with logs/attitude_check.py (auto-segments held poses, FC EKF vs FAST-LIO /Odometry, FC AHRS
      /mavros/imu/data cross-check). FC EKF and AHRS agree to <1deg on every pose (roll +-50, pitch +-44) ->
      FC attitude trustworthy. Matching each held pose, raw FAST-LIO /Odometry orientation maps to physical as:
        physical ROLL  (FC roll +48 / -49)  -> SLAM YAW   (+49 / -48)
        physical PITCH (FC pitch +42 / -43) -> SLAM ROLL  (+42 / -43)
        physical YAW   (not tested)         -> SLAM PITCH (by elimination)
      i.e. axis cycle  X->Z->Y->X. Magnitudes AND signs match within ~1deg on every pose -> FAST-LIO attitude
      is ACCURATE; this is purely an axis-relabeling consistent with up=+y (T9), NOT an estimation error.
      det of the permutation = +1 (proper rotation, no mirror) -> explains why yaw signs always read correct
      (T16 contradiction RESOLVED: there is no handedness flip; the "mirror" was a same-handed axis permutation).
    fix_sketch: >
      Remap SLAM orientation into ENU in fastlio_mavros_bridge.py. Inverse of the measured mapping:
        phys_roll = slam_yaw ; phys_pitch = slam_roll ; phys_yaw = slam_pitch
      i.e. sr,sp,sy = euler_from_quaternion(q_slam); q_enu = quaternion_from_euler(sy, sr, sp).
      Equivalent rotation_matrix (slam->enu, row-major) = [0,0,1, 1,0,0, 0,1,0] BUT note the bridge currently
      LEFT-multiplies orientation (M*q) which is wrong for a body-axis permutation (needs conjugation M*q*M^-1,
      or the euler-remap above). The same M is applied to POSITION too, so any change MUST be re-validated for
      position AND orientation jointly (held single-axis translation test) before trusting -- likely supersedes
      the flip_position_y hack (T15) and resolves the P8 handedness question.
      APPLIED to host source fastlio_mavros_bridge.py (new param ~remap_axes default true; euler-remap form, NOT the
      rotation_matrix left-multiply). NOT YET deployed/persistent: src is NOT bind-mounted (only config/logs/workspace
      are), file is gitignored (P7), and the live node runs from a devel copy -> needs docker cp to BOTH
      src/ and devel/lib/fast_lio/ + image rebuild to persist. Live FC still on old (permuted) bridge.
      Position half (P8) still unvalidated -> run held single-axis TRANSLATION test before trusting full pose.
    confirmation: >
      SECOND independent run (logs/bench_attitude_rot.bag, 57s, same routine) reproduced the SAME
      permutation cleanly: roll right FC roll +44.3 -> SLAM yaw +45.6 ; roll left FC -43.5 -> SLAM yaw -42.7 ;
      pitch fwd FC pitch +40.5 -> SLAM roll +41.0 ; pitch back FC -41.7 -> SLAM roll -41.2 (all within ~1-2deg,
      signs preserved). FC EKF vs AHRS agreed to 0.0deg on every segment. Mapping roll->yaw, pitch->roll
      validated twice -> remap fix (roll<-slam_yaw, pitch<-slam_roll, yaw<-slam_pitch) is correct.
      NOTE: attitude_check.py auto-segmenter needs >=5s holds; both runs' tilts were ~3-4s, so per-pose
      numbers were read from the 1s time series, not the auto-segment table (segmenter tweak pending).
    bags: ["logs/bench_attitude.bag (run1: roll+-50, pitch+-44)", "logs/bench_attitude_rot.bag (run2: roll+-44, pitch+-41)"]
    files: ["logs/attitude_check.py (new, this session)"]
    resolution: >
      RESOLVED + DEPLOYED (2026-06-16). Combined translation+rotation bench (logs/bench_combined2.bag) + a
      yaw-only run (logs/bench_yaw.bag) settled the full pose mapping:
        - POSITION: raw /Odometry is ALREADY correct ENU (fwd->+x, left->+y, up->+z). NO transform needed
          -> ~position_matrix = identity. The earlier "y<->z swap" seen vs /mavros was an artifact of the
          broken downstream bridge + the VELXY=6 position runaway, NOT a real frame relation.
        - ORIENTATION: the cyclic permutation, applied as a QUATERNION SIMILARITY transform
          q_enu = qR * q_odom * qR^-1, qR from orientation_matrix [0,0,1, 1,0,0, 0,1,0].
          The euler-remap form (first attempt) FAILED on large yaw: physical yaw -> odom_pitch ~90deg ->
          euler_from_quaternion gimbal lock -> yaw CCW came out -108 (should +90) with spurious roll/pitch.
          Quaternion form is gimbal-lock free. Live bridge output verified: yaw CW -92, CCW +90, roll/pitch ~0.
      Bridge refactored: position+orientation DECOUPLED; flip_position_y REMOVED (retires T15); single
      rotation_matrix coupling removed. DEPLOYED live (docker cp + pipeline relaunch, DISARMED) and PERSISTENT
      via a docker-compose.override.yml bind-mount of the host bridge over the image copy. Still gitignored (P7).
      Validation = bridge OUTPUT /mavros/vision_pose/pose (clean, upstream of EKF runaway) for ALL 9 moves.
    files_final: ["docker_src/.../FAST-LIO/src/fastlio_mavros_bridge.py", "logs/pose_check.py (new)", "docker-compose.override.yml (bind-mount)"]

  - id: T19
    title: "Make the transform + EKF origin automatic & persistent; FC PRX1 prearm fix"
    status: done
    detail: >
      (2026-06-16, all DISARMED.) Wrapped up persistence of this session's work:
      (1) BRIDGE TRANSFORM persistent: docker-compose.override.yml bind-mounts the host
          fastlio_mavros_bridge.py over the image copy; fastlio_to_fc.launch now PINS the validated
          transform explicitly (remap_axes=true, position_matrix=identity, orientation_matrix=[0,0,1,1,0,0,0,1,0])
          and the stale rotation_matrix rosparam was REMOVED. config/ is bind-mounted so the launch persists.
      (2) EKF ORIGIN now AUTOMATIC: added node 'set_ekf_origin' to the launch = a repeating (rostopic pub -r 0.1)
          publish of geographic_msgs/GeoPointStamped to /mavros/global_position/set_gp_origin. mavros-native
          (no pymavlink). Verified: publishing that msg sets the origin (gp_origin populated 42.56335,12.64329,163);
          node confirmed publishing the right msg to the right topic. Repeats so it survives the FC-connect race;
          ArduPilot ignores re-sends once origin locked. *** COORDS ARE PLACEHOLDER (Terni, IT) -- set real
          lat/lon/alt before geofence/RTL/global use; fine for local GPS-denied hold. ***
      WHY set_origin.py was abandoned: vision_to_mavros/set_origin.py needs python2 + pymavlink (neither in the
      container) AND publishes to /mavlink/to not /mavros/mavlink/to -> non-functional here. mavros-native topic
      is the clean path. The docs/learned set_ekf_origin.py was from a different rig, never wired here.
      (3) FC PRX1 prearm: PRX1_TYPE was 2 (MAVLink proximity) -> 'PreArm: PRX1: No Data'. Set PRX1_TYPE=0
          (persisted to FC EEPROM) + rebooted FC -> prearm error cleared (no PreArm broadcast in 45s; system_status
          back to 3 STANDBY). Reboot dropped the mavros serial link (known USB re-enumeration issue) -> recovered
          by relaunching the pipeline; FC re-enumerated on the SAME /dev/ttyACM0, device was NOT stale.
      (4) BAKED INTO IMAGE (2026-06-16): docker commit slam-hesai-fastlio -> slam-system:latest
          (new id 5e5a726b8610, 12.5GB). Verified a FRESH container (no bind-mount) has the fixed bridge
          (q_perm/position_matrix present). The earlier bridge bind-mount in docker-compose.override.yml was
          then REMOVED (image is now authoritative; override keeps only the USB mount). systemd boot runs
          'docker compose up -d slam-system' (no --build) so it reuses the baked image. A future 'compose build'
          rebuilds from the Dockerfile which COPYs docker_src (still has the fix) -> stays consistent.
      RESIDUAL (P7, deferred by user): still NOT in git. docker_src gitignored; a fresh clone lacks the fix
          until committed/un-ignored. Reproducibility-only; runtime persistence is solid.
    files: ["slam-system:latest (committed)", "docker-compose.override.yml", "config/fastlio_to_fc.launch", "FC param PRX1_TYPE=0 (EEPROM)"]

  - id: T20
    title: "Thumbdrive: stable UUID fstab mount (fixes broken container /mnt/usb)"
    status: done
    detail: >
      (2026-06-16.) Post-reboot verify found the container /mnt/usb was NOT the thumbdrive: udisks auto-mounted
      the SanDisk (UUID bd2f03a0-195c-498f-bb85-ec6119e529db, /dev/sda1, 931.5G ext4) at
      /media/revolute/<uuid>1 (trailing '1' suffix), but docker-compose.override.yml bind-mounted
      /media/revolute/<uuid> (NO '1') -> docker created an EMPTY dir there (on the internal NVMe) and mounted
      THAT. So writes to /mnt/usb hit the internal disk, not the stick. Root cause: the stale docker-created
      <uuid> dir made udisks append '1' -> self-perpetuating mismatch.
      FIX: added an fstab entry by UUID to a FIXED path:
        UUID=bd2f03a0-195c-498f-bb85-ec6119e529db  /mnt/thumbdrive  ext4  defaults,nofail,noatime  0  2
      (nofail = boot won't hang if drive absent; being in fstab also stops udisks /media auto-mount + suffix drift).
      Repointed override.yml: /mnt/thumbdrive:/mnt/usb:rw. Recreated container -> verified /mnt/usb == /dev/sda1,
      writable, and a file written inside the container appears on the host /mnt/thumbdrive (= the real stick).
      Persistent across reboot (fstab + override on disk, baked image). NOTE: gp_origin reads empty after a
      mavros restart even though the FC origin is still set (ArduPilot doesn't re-broadcast a locked origin).
      Also observed system_status=5 CRITICAL = 'PreArm: GCS failsafe on' (GCS was disconnected) -> clears on GCS reconnect.
    files: ["/etc/fstab (host)", "docker-compose.override.yml"]

  - id: T21
    title: "ROOT CAUSE of the flight drift: position_matrix was identity (wrong) -> scrambled position frame to FC"
    status: "fixed-and-bench-validated"
    detail: >
      (2026-06-16.) First flight after the transform work DRIFTED (right, then forward; pilot landed it).
      User ruled out the velocity config (P9) and the flip_position_y theory. Diagnosis from the bench data +
      user's frame spec: the raw /Odometry frame is (+x=LEFT, +y=UP, +z=FORWARD). My bench analysis MISLABELED
      the translation moves (matched axes to assumed ENU instead of the actual move SEQUENCE), so I wrongly set
      position_matrix=IDENTITY. With identity, the FC received position with scrambled axes (it read odom_x=left
      as forward, odom_y=up as left, odom_z=fwd as up) -> position-hold corrections applied in the wrong axes ->
      uncontrollable drift in flight. Orientation was fine (cyclic permutation, cross-checked vs FC IMU attitude).
      The bench could not reveal it: hand-moving the vehicle made the numbers self-consistent under the wrong labels;
      only closed-loop flight exposed it.
      FIX: position needs the SAME cyclic permutation as orientation (one rigid rotation):
        ENU_x(fwd)=odom_z ; ENU_y(left)=odom_x ; ENU_z(up)=odom_y  ->  position_matrix = [0,0,1, 1,0,0, 0,1,0]
      Applied: config/fastlio_to_fc.launch pins position_matrix=[0,0,1,1,0,0,0,1,0]; bridge .py default corrected
      to match; pipeline relaunched (verified live param + 20Hz vision_pose); image re-baked (docker commit ->
      slam-system:latest sha 825038356ce3). Supersedes the identity-position claim in T18/T20.
      *** DO NOT RE-FLY until a correctly-LABELED re-bench (label moves by SEQUENCE, not assumed ENU) confirms the
      bridge OUTPUT gives fwd->+x, left->+y, up->+z. Bench-validate before flight. *** [[multimodal-robot-modes]]
    files: ["config/fastlio_to_fc.launch", "docker_src/.../fastlio_mavros_bridge.py", "slam-system:latest (re-committed 825038356ce3)"]
    rebench_2026_06_20: >
      VALIDATED (motors DISARMED). New tool logs/vision_bench.py reads the BRIDGE OUTPUT
      /mavros/vision_pose/pose directly (upstream of EKF runaway), captures a HOME baseline, prints
      per-axis displacement + plain-language verdict so moves are labeled by ACTUAL physical action
      in real time (fixes the T16/T21 mislabeling failure mode). Held single-axis moves, heading constant:
        FORWARD -> dx=+0.63m (y=+0.04, z=+0.08)  -> +x  PASS
        LEFT    -> dy=+0.65m (x=+/-0.04, z=+0.14) -> +y  PASS
        UP      -> dz=+0.56m (x=-0.05, y=+0.02)   -> +z  PASS
      covTr flat ~9e-06 throughout (no divergence). position_matrix=[0,0,1,1,0,0,0,1,0] CONFIRMED correct.
      Bag: logs/bench_t21_pos.bag (7MB: vision_pose, Odometry, local_position, imu, tf). Live log: logs/vb_live.log.
      ** Frame is proven, but flight still BLOCKED by P9: EK3_SRC1_VELXY/VELZ verified live = 6 with NO velocity
         source published -> independent motion-runaway config (T13). Resolve P9 (publish velocity OR set VEL*=0)
         before flight. ** Tools added: logs/vision_bench.py.

  - id: T22
    title: "Uncontrolled CW yaw spin in flight -> ROOT CAUSE was MECHANICAL (motor spin direction)"
    status: done
    detail: >
      (2026-06-21.) Flight: uncontrolled CW yaw spin, altitude held. Diagnosed at length. Ruled OUT:
      vision yaw sign (bench rotation test: CW -> vision_pose yaw -90 deg, CORRECT sign+magnitude);
      compass (disabled it on a wrong hypothesis -> no change; then RESTORED, see below). REAL CAUSE
      (found by user): TWO REAR MOTORS spinning the WRONG DIRECTION -> net uncommanded yaw torque the
      controller couldn't null; altitude unaffected (collective thrust fine). NOT SLAM/EKF/frame/compass.
      LESSON: for a pure yaw spin with altitude holding, rule out mechanical/motor-order/FRAME_TYPE FIRST.
      Compass churn: temporarily set COMPASS_USE/USE2/USE3=0, ENABLE=0, EK3_SRC2/3_YAW=6; then REVERTED to
      originals (USE*=1, ENABLE=1, SRC2_YAW=1, SRC3_YAW=0) because compass is the OF-mode yaw fallback.
    files: ["FC params (EEPROM): COMPASS_* and EK3_SRC2/3_YAW restored to originals"]

  - id: T23
    title: "Publish ExternalNav VELOCITY (VISION_SPEED_ESTIMATE) -> RESOLVES P9 / T13"
    status: done
    detail: >
      (2026-06-21.) FAST-LIO /Odometry twist was all-zero, so EK3_SRC1_VELXY/VELZ=6 had no source (the T13
      runaway config). FIX (approach A, native EKF velocity, not differentiation):
        (1) laserMapping.cpp publish_odometry: fill odomAftMapped.twist.twist.linear from state_point.vel
            (WORLD/camera_init frame, same frame as pose.position).
        (2) fastlio_mavros_bridge.py: new publisher /mavros/vision_speed/speed_vector (Vector3Stamped),
            transforms the twist with the SAME chain as position (position_matrix + Rz(-yaw0)) so velocity and
            position share one frame. mavros vision_speed plugin already enabled (listen_twist:false -> speed_vector).
      VALIDATED on the bench (DISARMED): at rest ~0 m/s; hand-move directional test fwd->+x, left->+y, up->+z,
      clean axis isolation, sane magnitudes. Then flew with EK3_SRC1_VELXY/VELZ=6, VISO_VEL_M_NSE=0.1 ->
      user reports "no noticeable difference" (EXPECTED: velocity aiding is subtle when position is already
      fused; mainly tightens Loiter braking / reduces overshoot). Whether the EKF actually FUSED vs gated it
      was NOT verified from the dataflash log (offered, user moved on).
      PERSISTENCE: baked into image slam-system:latest (5fb89f2fae6f) and verified; survives container recreate.
      Fork commit of the 2 files PENDING (P10, blocked on git identity). Checkpoint commit 1e0d985 (tracked files).
    files: ["docker_src/.../FAST-LIO/src/laserMapping.cpp", "docker_src/.../FAST-LIO/src/fastlio_mavros_bridge.py", "slam-system:latest (5fb89f2fae6f)"]

  - id: T24
    title: "CAN (DroneCAN) rangefinder silent -> CAN driver/protocol index mismatch (fixed)"
    status: done
    detail: >
      (2026-06-22.) RNGFND1_TYPE=24 (DroneCAN, downward, ORIENT=25) on CAN2 reported NO data;
      /mavros/rangefinder/rangefinder empty; PreArm 'AHRS: EK3 sources require RangeFinder' blocked arming
      (ArduPilot validates ALL EK3 source sets; SRC2_POSZ=2 needs a rangefinder for OF mode). ROOT CAUSE:
      CAN_P2_DRIVER=1 (CAN2->virtual driver 1) but CAN_D1_PROTOCOL=0 (None), while DroneCAN was on driver 2
      (CAN_D2_PROTOCOL=1) which no port routed to -> no DroneCAN stack on the wire -> node never enumerated.
      A reboot ALONE does not help while the protocol mapping is wrong. FIX: CAN_D1_PROTOCOL=1 (match D2),
      keep CAN_P2_DRIVER=1, CAN_P2_BITRATE=1000000, then REBOOT FC (CAN init only at boot). RESULT: rangefinder
      live (range 0.12 m), prearm cleared. Saved as learning solution #5.
    files: ["FC params (EEPROM): CAN_D1_PROTOCOL=1"]

  - id: T25
    title: "FAST-LIO health check + confined-space tuning plan (drafted, NOT applied)"
    status: "advisory-pending"
    detail: >
      (2026-06-22, read-only.) Health snapshot (at rest, post-reboot): /lidar_points 20Hz, /lidar_imu 443Hz,
      /Odometry 20Hz, /fastlio_health 20Hz. fastlio_health: matched ~610, mean_residual ~0.031 m, ekf_update
      ~3 ms, eig[min/mid/max] ~80k/148k/380k (well-conditioned, NO degeneracy), velocity ~0 at rest.
      fastlio_mapping ~141% CPU of 12 cores (big headroom). Verdict: healthy + real-time; only a STATIC snapshot.
      CONFINED-SPACE TUNING PLAN drafted (advisory, user will revisit): Tier1 filter_size_surf/map 0.5->0.2-0.3,
      blind 1.0->0.3-0.5 (stay beyond self-return), point_filter_num 3->1-2; Tier2 det_range 100->20-30,
      cube_side_length 300->50-100. Validate via /fastlio_health (mean_residual ~cm, ekf_ms<<40, eig_min up,
      matched up). Full plan saved to scratchpad fastlio_confined_tuning.md (session-scoped; offer to move to docs/).
      NOTE: launch params OVERRIDE yaml -> filter_size/point_filter_num/cube_side/max_iter edit the LAUNCH;
      blind/det_range edit the YAML.

  - id: T26
    title: "Offline bag A/B (current vs confined-tuned) + APPLIED the tuning"
    status: done
    detail: >
      (2026-06-22, fully OFFLINE replay -- no FC/no arming.) Built a replay harness (scripts/replay/:
      fastlio_replay.launch, run_one.sh, compare_bags.py, run_experiment.sh, transcode_bag.py) that plays
      a recorded bag through laserMapping on an ISOLATED ros master :11312 (never touches live :11311),
      records /Odometry + /fastlio_health, and diffs two runs. Tested on massrobotics_3rd_floor.bag (233s).
      GOTCHA 1: that bag's /lidar_points carries per-point time in a 'timestamp' (f64 absolute) field, but
        FAST-LIO (lidar_type=2 Velodyne) needs a 'time' (f32 relative) field -> every scan dropped -> ZERO
        /Odometry in both runs. FIX: transcode_bag.py rewrites clouds to velodyne layout (time = timestamp -
        scan_min, f32), passing /lidar_imu through -> input_velodyne.bag. (Live driver already emits 'time'.)
      GOTCHA 2: first A/B ran at rate 1.0 ALONGSIDE the live pipeline -> CPU contention + tuned too heavy ->
        tuned dropped ~237 scans, ended early, trajectory garbage; ekf_ms inflated (p95 141, max 210). Re-ran
        CLEAN: SIGSTOP the live laserMapping (frees CPU, reversible via SIGCONT), rate 0.5 -> both runs
        processed the FULL bag.
      CLEAN RESULT (current -> tuned): mean_residual 0.051 -> 0.036 m (-30%); matched_pts 361 -> 2556 (7x);
        eig_min mean 56.9k -> 539k, MIN 178 -> 20719 (worst-case observability hugely improved); ekf_update_ms
        mean 4.7 -> 13.9, max 19 -> 33 ms (< 50 ms / 20 Hz budget => real-time-safe). Net-displacement dropped
        as a metric (no ground truth). Verdict: tuned is better-constrained AND affordable.
      APPLIED (this is now the live config, pending restart): see changes section. det_range/cube_side kept.
      CAVEAT: offline bag was 10 Hz; onboard 20 Hz has tighter 50 ms budget (33 ms max should still hold).
        blind=0.4 on the LIVE sensor -> verify no airframe self-returns in 0.4-1.0 m.
    files: ["scripts/replay/* (new harness)", "config/fastlio_to_fc.launch", "config/hesai_jt128.yaml"]

  - id: T27
    title: "Thumbdrive re-clone fallout: boot-from-USB fix, reformat, fstab dedup + record verify"
    status: done
    detail: >
      (2026-07-08.) The SanDisk Extreme Pro thumbdrive had been dd-cloned from the internal OS disk
      (nvme0n1), so it carried IDENTICAL GPT partition GUIDs + filesystem UUIDs. Two consequences fixed:
      (1) BOOT-FROM-USB: firmware boot entry Boot0001 targets the ESP by GPT GUID (ff9ebfc2-...); the clone's
        ESP had the same GUID, so with the stick plugged in at power-on the firmware booted the USB copy.
        FIX: randomized the clone's partition GUIDs -> `sgdisk --partition-guid=1:R/2:R /dev/sda`. Boot0001 now
        resolves only to the internal disk. (Data/filesystems untouched; PARTUUID changes only.)
      (2) MOUNT / RECORDINGS: original recordings were lost when the stick was dd'd over (accepted by user).
        Reformatted the recordings partition: `mkfs.ext4 -L recordings /dev/sda2` (PARTUUID preserved:
        30bbee5a-e842-41ea-9b11-91d15f90e637). Persistent mount is now by PARTUUID (unique), NOT fs-UUID
        (still duplicated with internal root -> using fs-UUID would be ambiguous/dangerous):
          PARTUUID=30bbee5a-...-91d15f90e637  /mnt/thumbdrive  ext4  defaults,nofail,x-systemd.device-timeout=10s  0  2
        GOTCHA: a STALE duplicate fstab line (UUID=4667-2F38 ... exfat, the old pre-clone stick) shadowed the
        new one -> systemd built mnt-thumbdrive.mount from the dead exfat device -> "Dependency failed", nothing
        mounted after reboot. FIX: deleted the stale line. Also recreated the `.slam_thumbdrive` marker (mkfs
        wiped it; loggers refuse to record without it) and restarted the container so the /mnt/thumbdrive:/mnt/usb
        bind re-resolved to the freshly-mounted drive. Verified end-to-end: host /mnt/thumbdrive == /dev/sda2 (rw),
        marker present, container /mnt/usb writable.
      RECORD VERIFICATION (fake triggers, NO ARMING, disarmed bench):
        - auto-record (flight_recorder, fake /mavros/state armed=true->false): SESSION START/STOP OK, valid lz4
          bag, 29-topic diagnostic set. (Real mavros publishes armed=false @2Hz -> races the fake, so hold the
          fake window short; short bag is expected, mechanism confirmed.)
        - ch9-record (ch9_logger, fake /mavros/rc/in ch9=1800 HIGH -> 1000 LOW): ~5s session, 65MB bag
          (/lidar_imu 1926 + /lidar_points 87) + .las map snapshot; clean stop on CH9 LOW. HIGH/LOW values kept
          OUTSIDE drift_monitor band [1400,1600] so NO LAND fired (confirmed in drift_monitor log).
        - ch9-reset (drift_monitor): NOT triggered -- fake CH9 mid-band would make drift_monitor send set_mode
          LAND to the live FC (a mode-change command; barred by the hard safety rule). Wiring confirmed from
          logs/source only (subscribed /mavros/rc/in, band[1400,1600], 1.5s dwell, gates auto_restart+critical_fc).
      NOTE: container healthcheck reports "unhealthy" -- false alarm; the healthcheck runs `rostopic` without
        sourcing ROS so it always errors. Pipeline itself fully up (lidar 20Hz, imu 438Hz, Odometry/vision_pose
        20Hz, local_position 50Hz).
    files: ["/etc/fstab (host: stale exfat line removed, PARTUUID line kept)", "/dev/sda GPT GUIDs (host)", "/mnt/thumbdrive/.slam_thumbdrive"]
    supersedes: "T20 (old UUID=bd2f03a0 fs-UUID mount; drive was re-cloned -> now PARTUUID mount)"
    priority: high

