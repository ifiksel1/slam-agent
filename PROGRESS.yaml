  systemd:
    - "slam-container.service   # docker compose up -d slam-system (oneshot, RemainAfterExit)"
    - "slam-fastlio.service     # docker exec roslaunch fastlio_to_fc.launch"
    - "NOTE: systemctl start/restart needs root (no passwordless sudo in agent shell). Reboot to apply."
  sensor: "Hesai JT128 LiDAR (publishes /lidar_points + /lidar_imu directly)"
  flight_controller: "mRo Pixracer Pro over USB CDC-ACM /dev/ttyACM0 @921600, MAVROS, ArduPilot"
  fc_ekf_sources: >
    SRC1 (vision/SLAM mode): POSXY=6 POSZ=6 VELXY=6 VELZ=6 YAW=6 (all ExternalNav). GPS1_TYPE=0.
    *** 2026-06-21: VELXY/VELZ=6 is now VALID -- velocity IS published (T23/P9 resolved): laserMapping
    fills /Odometry twist from the IEKF velocity state, bridge forwards it to /mavros/vision_speed/speed_vector.
    The T13 runaway only happened when 6 had NO velocity source; that's fixed. VISO_VEL_M_NSE=0.1. ***
    SRC2 (optical-flow mode): POSXY=0 POSZ=2(RangeFinder) VELXY=5(OpticalFlow) VELZ=0 YAW=1(Compass). FLOW_TYPE=6.
    SRC3: all 0 (unused). Compass deliberately ENABLED as the OF-mode yaw fallback (see audit note).
  fc_frame: "/mavros/local_position/pose = ENU world frame (x=East, y=North, z=Up), ~50Hz. NOT body-relative. mavros auto-converts ArduPilot NED<->ROS ENU. Body=FLU (fwd+x,left+y,up+z) per REP-103; yaw CCW-positive, 0=East."
  fc_baud: "fcu_url /dev/ttyACM0:921600 (USB CDC-ACM -> baud is cosmetic, USB ignores it). timesync locked ~3ms RTT."
  fc_params_dump: "config/fc_ekf_params.parm  # captured FC params for reflash reproducibility (NOTE: lists VELXY/VELZ=0, the validated value)"
  fc_prearm: "PreArm: PRX1: No Data (PRX1_TYPE=2 MAVLink proximity, unfed) + RC_RECEIVER unhealthy (no TX). Block arming; not fixed."
  fc_audit_deferred: "COMPASS_USE=1 is DELIBERATE (2026-06-22) = OF-mode (SRC2) yaw fallback; do NOT disable. Only 1 physical compass (DEV_ID 590090; slots 2/3 empty, USE2/3=1 harmless). EK3_SRC1_POSZ=6 vision height (consider 1=baro); VISO_DELAY_MS=50 (estimate, validate); no loop-closure node (SC-PGO not launched -> pure FAST-LIO odometry, drift not corrected)."

