  - id: T18
    title: "Attitude (RPY) bench validation -> SLAM orientation is a clean 3-axis cyclic PERMUTATION (frame, not error)"
    status: done
    detail: >
      Static bench, motors DISARMED. Sequence: level home -> roll right -> home -> roll left -> home ->
      pitch fwd -> home -> pitch back -> home (yaw not exercised). Recorded logs/bench_attitude.bag (66s),
      analyzed with logs/attitude_check.py (auto-segments held poses, FC EKF vs FAST-LIO /Odometry, FC AHRS
      /mavros/imu/data cross-check). FC EKF and AHRS agree to <1deg on every pose (roll +-50, pitch +-44) ->
      FC attitude trustworthy. Matching each held pose, raw FAST-LIO /Odometry orientation maps to physical as:
        physical ROLL  (FC roll +48 / -49)  -> SLAM YAW   (+49 / -48)
        physical PITCH (FC pitch +42 / -43) -> SLAM ROLL  (+42 / -43)
        physical YAW   (not tested)         -> SLAM PITCH (by elimination)
      i.e. axis cycle  X->Z->Y->X. Magnitudes AND signs match within ~1deg on every pose -> FAST-LIO attitude
      is ACCURATE; this is purely an axis-relabeling consistent with up=+y (T9), NOT an estimation error.
      det of the permutation = +1 (proper rotation, no mirror) -> explains why yaw signs always read correct
      (T16 contradiction RESOLVED: there is no handedness flip; the "mirror" was a same-handed axis permutation).
    fix_sketch: >
      Remap SLAM orientation into ENU in fastlio_mavros_bridge.py. Inverse of the measured mapping:
        phys_roll = slam_yaw ; phys_pitch = slam_roll ; phys_yaw = slam_pitch
      i.e. sr,sp,sy = euler_from_quaternion(q_slam); q_enu = quaternion_from_euler(sy, sr, sp).
      Equivalent rotation_matrix (slam->enu, row-major) = [0,0,1, 1,0,0, 0,1,0] BUT note the bridge currently
      LEFT-multiplies orientation (M*q) which is wrong for a body-axis permutation (needs conjugation M*q*M^-1,
      or the euler-remap above). The same M is applied to POSITION too, so any change MUST be re-validated for
      position AND orientation jointly (held single-axis translation test) before trusting -- likely supersedes
      the flip_position_y hack (T15) and resolves the P8 handedness question.
      APPLIED to host source fastlio_mavros_bridge.py (new param ~remap_axes default true; euler-remap form, NOT the
      rotation_matrix left-multiply). NOT YET deployed/persistent: src is NOT bind-mounted (only config/logs/workspace
      are), file is gitignored (P7), and the live node runs from a devel copy -> needs docker cp to BOTH
      src/ and devel/lib/fast_lio/ + image rebuild to persist. Live FC still on old (permuted) bridge.
      Position half (P8) still unvalidated -> run held single-axis TRANSLATION test before trusting full pose.
    confirmation: >
      SECOND independent run (logs/bench_attitude_rot.bag, 57s, same routine) reproduced the SAME
      permutation cleanly: roll right FC roll +44.3 -> SLAM yaw +45.6 ; roll left FC -43.5 -> SLAM yaw -42.7 ;
      pitch fwd FC pitch +40.5 -> SLAM roll +41.0 ; pitch back FC -41.7 -> SLAM roll -41.2 (all within ~1-2deg,
      signs preserved). FC EKF vs AHRS agreed to 0.0deg on every segment. Mapping roll->yaw, pitch->roll
      validated twice -> remap fix (roll<-slam_yaw, pitch<-slam_roll, yaw<-slam_pitch) is correct.
      NOTE: attitude_check.py auto-segmenter needs >=5s holds; both runs' tilts were ~3-4s, so per-pose
      numbers were read from the 1s time series, not the auto-segment table (segmenter tweak pending).
    bags: ["logs/bench_attitude.bag (run1: roll+-50, pitch+-44)", "logs/bench_attitude_rot.bag (run2: roll+-44, pitch+-41)"]
    files: ["logs/attitude_check.py (new, this session)"]
    resolution: >
      RESOLVED + DEPLOYED (2026-06-16). Combined translation+rotation bench (logs/bench_combined2.bag) + a
      yaw-only run (logs/bench_yaw.bag) settled the full pose mapping:
        - POSITION: raw /Odometry is ALREADY correct ENU (fwd->+x, left->+y, up->+z). NO transform needed
          -> ~position_matrix = identity. The earlier "y<->z swap" seen vs /mavros was an artifact of the
          broken downstream bridge + the VELXY=6 position runaway, NOT a real frame relation.
        - ORIENTATION: the cyclic permutation, applied as a QUATERNION SIMILARITY transform
          q_enu = qR * q_odom * qR^-1, qR from orientation_matrix [0,0,1, 1,0,0, 0,1,0].
          The euler-remap form (first attempt) FAILED on large yaw: physical yaw -> odom_pitch ~90deg ->
          euler_from_quaternion gimbal lock -> yaw CCW came out -108 (should +90) with spurious roll/pitch.
          Quaternion form is gimbal-lock free. Live bridge output verified: yaw CW -92, CCW +90, roll/pitch ~0.
      Bridge refactored: position+orientation DECOUPLED; flip_position_y REMOVED (retires T15); single
      rotation_matrix coupling removed. DEPLOYED live (docker cp + pipeline relaunch, DISARMED) and PERSISTENT
      via a docker-compose.override.yml bind-mount of the host bridge over the image copy. Still gitignored (P7).
      Validation = bridge OUTPUT /mavros/vision_pose/pose (clean, upstream of EKF runaway) for ALL 9 moves.
    files_final: ["docker_src/.../FAST-LIO/src/fastlio_mavros_bridge.py", "logs/pose_check.py (new)", "docker-compose.override.yml (bind-mount)"]

