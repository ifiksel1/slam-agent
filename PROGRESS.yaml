      FIX: fastlio_mavros_bridge.py now captures yaw0 from first pose and rotates EVERY pose by -yaw0
      about vertical (BOTH position and orientation -> self-consistent). Param ~zero_initial_yaw (default true).
      Deployed live (docker cp + rosnode restart, disarmed). VERIFIED: vision_pose yaw=0.0; FC EKF yaw
