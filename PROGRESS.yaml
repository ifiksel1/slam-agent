    title: "NUC/FAST-LIO sweep fixes: pcd_save off, cube_side_length 1000->300"
    status: done
    detail: >
      Full NUC-side audit. Found pcd_save_en=true (interval=-1) writing multi-GB PCDs (3.6GB found) with
      periodic blocking disk I/O that stalls the SLAM loop + RAM-growth risk -> set pcd_save_en=false in
      config/hesai_jt128.yaml. Found cube_side_length=1000 (local map never trims -> unbounded ikd-tree on
      long runs) -> set 300 in config/fastlio_to_fc.launch. Both bind-mounted (reboot-persistent), applied
