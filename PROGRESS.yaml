  - id: P18
    title: "Loiter altitude instability (facility) -- ROOT-CAUSED + FIX VALIDATED in flight"
    status: RESOLVED
    resolution: >
      (2026-07-02) VALIDATED FIXED in flight. Post-tuning flight 'hover_flight_after_problem_resolution'
      (log 96, xcorr 1.000 to its bag) matches the office baseline on EVERY metric vs the bad 'before' flight:
      /Odometry 17->20Hz; ekf_update_ms peak 83->44ms (under 50 budget); ds_pts 13.4k->11k; VISP 17.5->20Hz;
      velocity-innov rejection 26%->0%; EKF lane switches 4->0; FC-climb-rate-vs-vision corr -0.18->+0.94;
      FC-alt-vs-vision divergence 5.66m->0.06m. The tuning half (vision rate) is causally proven: ekf_ms/Odom/VISP
      improvements are deterministic results of the P19 config change, not vibration.
      VIBRATION reframed (user insight + data): NOT an independent cause -- it is largely downstream/co-occurring
      via a feedback loop (weak SLAM feed -> bad EKF climb-rate -> altitude excursions -> extra vibration -> noisier
      IMU -> worse EKF). Data: within-flight corr(VibeZ,|climb-rate|)=0.38 (weak), corr(VibeZ,|throttle-change|)=0.17
      (throttle output steady ~0.38 despite estimate swinging); vibration is mostly baseline 'motors-at-flight-power'
      (~8-11 airborne, ~0 landed). before VibeZ peak 36.6 vs hover 14.7. So fixing SLAM rate breaks the loop at the
      source -> hover clean on BOTH axes without any mechanical change. Vibration NOT confirmed as downstream 100%;
      optional confirmation = a deliberately dynamic flight (manhole) staying stable+low-vibe.
    detail: >
      Symptom: altitude unstable in Loiter in the big facility; a prior office flight was rock-solid; Stabilize
      (manual throttle) always fine (doesn't use the EKF vertical loop). Deep-diagnosed with BOTH the auto-record
      rosbag (companion side) and the ArduPilot dataflash .bin (FC side), comparing the good office flight vs the
      bad facility flight.
      CONFIRMED PAIR: FC log '94 01-07-2026' <-> bag 07_01_2026_20_08_26_flight (altitude-trace xcorr=1.000);
      bad flight = 07_02_2026_14_47_09_flight + log '95'.
      RULED OUT: config change (params byte-identical except auto-relearned gyro/baro cal); SLAM accuracy
      (observability healthy eig_min 1-2M, vision pos/vel self-consistent); FC<->NUC connection (VISP delivered,
      0% Ign); vibration-ALONE (within-flight VibeZ<->rejection corr only 0.39; rejection even at ~0 vibe).
      ROOT CAUSE: DEGRADED vision update rate to FC -- VISP 17.5Hz w/ 2x jitter (std 6.6->13.2ms) because FAST-LIO
      frame-starved in the dense facility (ekf_update_ms 40mean/83peak vs 50 budget, 13.4k ds_pts ~2x office's 7k)
      -> EKF rejected 26% of velocity innovations + 4 IMU-lane switches -> vertical-velocity estimate DECOUPLED from
      vision (fc_vz vs vis_vz corr -0.18; FC alt diverged up to 5.66m) -> Loiter chases bad climb-rate. Vibration
      is a downstream/co-occurring amplifier via feedback loop (see resolution), not an independent root cause.
      Good office flight: 20Hz vision, 0% rejection, 0 lane switches, alt tracked vision to 7cm, corr 0.87.
    fix_status: "RESOLVED by P19 compute-load tuning; validated in the 'hover' flight. Flight-data archive: office_test (good/94), before_problem_resolution (bad/95), hover_flight_after_problem_resolution (fixed/96), manhole_flight (dynamic post-fix/97) -- each dir has bag+.bin, verified xcorr=1.000."
