  - id: P13
    title: "Drift early-warning + LAND/restart (drift CRITICAL + CH9 trigger) -- IMPLEMENTED, gates ON, live-tested"
    status: in_progress
    implementation: >
      (2026-06-23, T27/T28) drift_monitor.py full feature set, gates ENABLED per user sign-off. LAND + restart
      fires from EITHER drift CRITICAL OR pilot CH9 (3-pos middle ~1500, edge-triggered, 1400-1600 band).
      Shared _land_and_restart: set_mode LAND (enable_critical_fc) + restart BOTH /laserMapping AND
      /fastlio_mavros_bridge (enable_auto_restart, restart_nodes; both respawn=true) so the SLAM->FC chain
      reboots fully (clears bridge yaw-datum). Arm-block left to FC EKF prearm (vision drops during restart);
      /slam/arm_interlock is advisory. Robustness: (a) startup-in-band guard (ch9_in_band=None -> never fire if
      booted in-band); (b) gap re-warm (health gap => SLAM restarted => drop baseline, latch OK => no CRITICAL
      restart-loop); (c) interlock releases ONLY after the restart's health-gap is seen + k_release healthy
      scans (fixes premature 'ready to arm'). GCS msgs trimmed to 3: 'Restart triggered manually'|'Drift
      detected, restart triggered' -> 'Restart in progress' -> 'Restarted, ready to arm'. No heartbeat. WARN
      is /slam/drift_risk topic-only (no banner).
    live_test: >
      CH9 flip on the real controller (DISARMED): out-of-band(1045) -> middle(1495) fired correctly -> LAND
      commanded, FC->LAND, both nodes restarted+recovered, re-warm prevented a loop. First test exposed a
      premature 'ready to arm' (released instantly off stale n_ok) -> FIXED (saw_gap guard) + re-validated
      offline (locked at risk-msg#24, released only at #70 after the simulated gap+recovery).
    validation_offline: >
      Replayed out_tuned.bag /fastlio_health (2327 scans) into the node: 2148 OK (92%) / 179 WARN (8%) / 0
      CRITICAL. WARN fired on the degenerate stretch (~scans 1348-1539, longest run 158) and stayed OK
      elsewhere; NO false CRITICAL (bag never hit eig<5k or matched<150); interlock stayed RELEASED (only
      locks on CRITICAL); clean hysteresis (solid blocks, no flicker). Detection logic confirmed correct.
    detail: >
      Read-only drift_monitor node design (2026-06-22). Detects the CAUSE of drift (lost observability)
      from /fastlio_health BEFORE the trajectory diverges. Primary signal eig_min (weakest-axis
      observability); matched_pts is a secondary/confirming signal (weaker -- it measures quantity not
      geometry, so it misses the high-count corridor-degeneracy case eig_min catches). NO ground truth
      online, so this detects drift-prone CONDITIONS + divergence symptoms, not absolute drift.
    signals: "eig_min = /fastlio_health.data[4] (primary) ; matched_pts = data[0] (secondary)"
    logic: >
      Each metric gets a RELATIVE trigger (vs rolling median, adapts to env/config) -> WARN, and an
      ABSOLUTE floor (safety net if baseline itself is bad) -> CRITICAL. Combine with OR within each tier
      (any one is enough -- NOT both), severity = worst that fired, then HYSTERESIS K=5 consecutive scans
      before latching (suppresses single-scan blips). eig_min owns the primary CRITICAL; matched CRITICAL
      is the extreme-starvation backstop.
    thresholds_calibrated: >
      From massrobotics_3rd_floor.bag, TUNED config (T26 calibrate_thresholds.py; recalibrate per config --
      old config baselines were ~7-10x lower). eig_min median ~591k: WARN < 0.2xmedian (~110k) OR < 40k ;
      CRITICAL < ~5k. matched median ~2638: WARN < 0.25xmedian (~600) OR < 300 ; CRITICAL < 150.
      (Bag was 10 Hz; live 20 Hz -- relative thresholds transfer, re-confirm absolute floors live.)
    response: >
      WARN  -> notify pilot only: STATUSTEXT to GCS message banner ("DRIFT WARNING: eig_min/matched"). NO FC action.
      CRITICAL -> (1) command FC to LAND mode, (2) restart the FAST-LIO node, (3) set ARM INTERLOCK = LOCKED
                  (prearm refuses arm) until FAST-LIO finishes restarting AND health back in nominal range for
                  K scans, then RELEASE -> pilot may arm only after that.
    safety_caveats: >
      (a) CRITICAL auto-commands the FC (LAND + arm lock) -> a false-positive CRITICAL forces an unwanted
      mid-flight auto-land; consider a LARGER K for the CRITICAL/LAND path than for WARN.
      (b) LAND still uses the (degraded) SLAM for horizontal hold during descent -- confirm LAND behaves
      acceptably under poor position, or pick a mode safer under bad horizontal estimate.
      *** Implementing the CRITICAL path crosses the project read-only rule (it commands the FC); explicit
      user sign-off required before any code that sends mode-change/arming commands. ***
    flowchart: |
      (drift_monitor logic -- one pass per /fastlio_health scan, read top to bottom)
                  ┌──────────────────────────────┐
                  │ /fastlio_health (per scan)    │
                  │  eig_min (d[4]), matched (d[0])│
                  └───────────────┬──────────────┘
                                  ▼
              ┌───────────────────────────────────────────────────────────┐
              │ WARN gate (OR):  eig_min<0.2×med  OR  matched<0.25×med OR <300│
              │ CRIT gate (OR):  eig_min<40k/5k   OR  matched<150 (starvation)│
              │ severity = worst that fired ; HYSTERESIS K=5 scans           │
              └───────────────┬───────────────────────────────────────────┘
                              ▼
                      ┌───────────────┐
                      │  severity?    │
                      └──┬────────┬───┬┘
                  OK     │   WARN │   │ CRITICAL
              ┌──────────┘        │   └───────────────────────────────┐
              ▼                   ▼                                    ▼
       ┌─────────────┐  ┌──────────────────────┐  ┌──────────────────────────────────┐
       │ nominal;     │  │ NOTIFY pilot only:    │  │ (1) FC → LAND mode                │
       │ keep interlock│  │  STATUSTEXT to GCS    │  │ (2) restart FAST-LIO node          │
       │ until healthy │  │  msg banner           │  │ (3) ARM INTERLOCK = LOCKED         │
       │ + restart done│  │ NO FC action          │  └─────────────────┬────────────────┘
       └──────┬───────┘  └───────────┬──────────┘                    ▼
              │                      │             ┌──────────────────────────────────┐
              │                      │             │ FAST-LIO restarting...             │
              │                      │             │  wait re-init + health nominal     │
              │                      │             │  for K scans                       │
              │                      │             └─────────────────┬────────────────┘
              │                      │                               ▼ healthy
              │                      │             ┌──────────────────────────────────┐
              │                      │             │ ARM INTERLOCK = RELEASED           │
              │                      │             │ pilot may arm ONLY now             │
              │                      │             └─────────────────┬────────────────┘
              └──────────────────────┴───────────────────────────────┘
                                     ▼
                       (loop on next /fastlio_health scan)

       ARM INTERLOCK gate (enforced every arm attempt):
         LOCKED   → prearm refuses arm ("FAST-LIO restarting")
         RELEASED → arm permitted
    files: ["docker_src/.../FAST-LIO/src/drift_monitor.py (NEW, built+installed)", "docker_src/.../FAST-LIO/CMakeLists.txt (catkin_install_python)", "config/fastlio_to_fc.launch (drift_monitor node + laserMapping respawn=true)", "scripts/replay/calibrate_thresholds.py (thresholds)", "docs/DRIFT_MONITOR_PLAN.md (plan)"]
    trigger_update: "WARN now uses rolling-AVERAGE baseline + factor 0.2 for both (eig<0.2xavg|<40k OR matched<0.2xavg|<300); K=5 for BOTH warn & crit (=0.25s @20Hz). Re-validated offline: 2212 OK/115 WARN/0 CRIT, same degenerate stretch."
    image_baked: "DONE -- slam-system:latest = 9be489cc0e95 (drift_monitor + velocity verified baked). Survives container RECREATE."
    remaining: "fork push (P10 -- docker_src gitignored, re-clone would wipe drift_monitor.py); live read-only run (needs P14 pipeline restart); bench/SITL test enable_auto_restart, then enable_critical_fc (LAND) -- LATTER NEEDS EXPLICIT SIGN-OFF."
    priority: high

