meta:
  project: "FAST-LIO SLAM remote visualization + failure diagnostics"
  goal: >
    Stream FAST-LIO map + diagnostic topics from the NUC to a remote computer via
    Foxglove, to understand WHEN and HOW FAST-LIO fails (GPS-denied drone SLAM).
  last_updated: "2026-07-23"
  branch: "boot-services"
  safety_note: "Read-only visualization only. NEVER arm or command the drone/FC. Also: do NOT change system state (params/configs/y-flip) the user did not explicitly ask to change."

