YAML: 1.0

# Adaptive-LIO (chengwei0427/adaptive_lio) config ported to the Dragunfly rig:
#   Jetson Orin NX + Ouster OS1-64 (internal ICM-20948 IMU) + Cube Orange (ArduPilot).
# Generated by SLAM Integration Agent — mirrors the EllipseLIO / COIN-LIO hardware+transform
# contract but expressed in Adaptive-LIO's native (CT-ICP-derived) schema.
#
# Adaptive-LIO reads THIS file from a COMPILE-TIME path: ROOT_DIR + "config/mapping_m.yaml".
# The build overwrites the repo's config/mapping_m.yaml with this file (and the run scripts
# also bind-mount it) so edits here take effect without recompiling. Keep the filename mapping
# in mind: on disk inside the container this lives at <pkg>/config/mapping_m.yaml.
#
# Only the Ouster-specific lines were changed from upstream mapping_m.yaml; every CT-ICP /
# adaptive-map tuning parameter is left at the author's default unless noted.

preprocess:
  point_filter_num: 1
  lidar_type: 3          # CHANGED 1(AVIA)->3 : OUST64 (see preprocess.h LidarType enum)
  blind: 0.3             # CHANGED 0.1->0.3 : drop self-returns from props/frame; matches EllipseLIO min_range=0.3
  sweep_cut_num: 1
  degenerate_window_num: 10

common:
  imu_topic: /ouster/imu     # CHANGED /livox/imu  -> Ouster built-in ICM-20948 (100 Hz)
  lid_topic: /ouster/points  # CHANGED /livox/lidar -> Ouster OS1-64 (1024x20 => 20 Hz)
  gnorm: 9.805               # CHANGED 1 -> 9.805 : Ouster IMU reports accel in m/s^2 (NOT normalized to 1 g)

mapping:
  # Lidar<-IMU extrinsic. On the ROS1 Ouster driver the point cloud (os_lidar) and IMU (os_imu)
  # come in a convention where the FAST-LIO family uses the IDENTITY extrinsic on this rig
  # (see repo config/ouster64.yaml). The diag(-1,-1,1) 180-deg yaw that EllipseLIO used was a
  # ROS2-driver artifact and must NOT be carried over here. extrinsic_est_en online-refines it.
  extrinsic_est_en: true
  extrinsic_T: [0, 0, 0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

map_options:
  map_type: MULTI_RESOLUTION_VOXEL_HASHMAP
  resolutions:
    - resolution: 0.2      # finest = 0.2 m (EllipseLIO found 0.1 starved features -> IMU runaway; 0.2 is safe)
      max_num_points: 20
      min_distance_between_points: 0.05
    - resolution: 0.5
      max_num_points: 20
      min_distance_between_points: 0.15
    - resolution: 1.2
      max_num_points: 40
      min_distance_between_points: 0.2
  neig_options:
    distance_max: 80       # matches EllipseLIO max_range=80 (was 100 upstream on other lidars)
    radius_min: 0.2
    radius_max: 1.2
    exponent: 1.0

delay_time: 0.2

odometry:
  surf_res: 0.5
  log_print: false
  max_num_iteration: 10
  # ct_icp
  icpmodel: CT_POINT_TO_PLANE # Options: [CT_POINT_TO_PLANE, POINT_TO_PLANE]
  size_voxel_map: 0.5 # The voxel size of in the voxel map
  min_distance_points: 0.15
  max_num_points_in_voxel: 20 # The maximum number of points per voxel of the map
  max_distance: 500.0 # The threshold of the distance to suppress voxels from the map
  weight_alpha: 0.9
  weight_neighborhood: 0.1
  max_dist_to_plane_icp: 0.3 # This is important
  init_num_frames: 20
  voxel_neighborhood: 1
  max_number_neighbors: 20
  threshold_voxel_occupancy: 1
  estimate_normal_from_neighborhood: true
  min_number_neighbors: 20 # The minimum number of neighbor points to define a valid neighborhood
  power_planarity: 2.0
  num_closest_neighbors: 1

  sampling_rate: 1.5
  max_num_residuals: 1200
  min_num_residuals: 50
  motion_compensation: CONSTANT_VELOCITY #NONE, CONSTANT_VELOCITY, ITERATIVE, CONTINUOUS
  beta_location_consistency: 0.001
  beta_orientation_consistency: 0.1
  beta_constant_velocity: 0.001
  beta_small_velocity: 0.01

  thres_translation_norm: 0.01 # m
  thres_orientation_norm: 0.1 # deg

  # IMU saturation thresholds for Adaptive-LIO's LIO<->LO motion-mode switching (fault detection).
  # ICM-20948 defaults: accel FSR +-16 g ~= 157 m/s^2, gyro FSR +-2000 dps ~= 34.9 rad/s. The
  # author notes these are "not related to units"; leaving the upstream values that were tuned to
  # trigger on genuine saturation. Revisit in Phase 7 if mode-switching misfires on this IMU.
  satu_acc: 19.5
  satu_gyro: 16
