common:
    lid_topic:  "/lidar_points"
    imu_topic:  "/lidar_imu"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR
    scan_line: 128               # JT128 has 128 scan lines
    blind: 1.0                   # Minimum range threshold
    time_scale: 1.0              # Time scale for point timestamps

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180          # Field of view for mapping
    det_range:     100.0        # Maximum detection range
    extrinsic_est_en:  false    # DISABLED: online extrinsic estimation causes drift - calibrate offline!
    extrinsic_T: [ 0.006622, -0.009142, -0.039155 ]  # Calibrated IMU->LiDAR translation (m)
    extrinsic_R: [ 0.998625, -0.032668, -0.040998,
                   0.033462,  0.999262,  0.018837,
                   0.040353, -0.020183,  0.998982 ]   # Calibrated IMU->LiDAR rotation (row-major)

publish:
    path_en:  true              # true: publish path
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false           # OFF for live flight: was writing multi-GB PCDs + periodic blocking disk I/O that stalls the SLAM loop
    interval: -1                 # how many LiDAR frames saved in each pcd file;
                                # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
    time_interval: 30.0         # Save PCD every 30 seconds