# systemd drop-in for QuadRover robots only: slam-fastlio.service starts the QuadRover launch
# (config/fastlio_to_fc_quadrover.launch: drift_monitor ~quadrover, restart_mode of, the bridge's
# frame re-anchor). Other robots keep the shared fastlio_to_fc.launch. Install on a QuadRover robot:
#   sudo install -D -m 644 deploy/slam-fastlio-quadrover.conf /etc/systemd/system/slam-fastlio.service.d/quadrover.conf
#   sudo systemctl daemon-reload
# Remove it (and daemon-reload) to go back to the shared launch.
[Service]
ExecStart=
ExecStart=/usr/bin/docker exec slam-hesai-fastlio bash -lc 'source /opt/ros/noetic/setup.bash && source /root/slam_ws/devel/setup.bash && exec roslaunch $(rospack find fast_lio)/config/fastlio_to_fc_quadrover.launch'
