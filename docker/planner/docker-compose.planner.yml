# L4 planner stack on the companion (nuc-01), beside slam-hesai-fastlio.
# CPUs 8-11 only: FAST-LIO owns 0,2,4,6. Host network: same ROS master as the SLAM container.
# Start only with the owner's go-ahead; the planner bridge streams Guided setpoints when the FC is in
# GUIDED, so on the robot it is brought up for bench tests with props off first (L3).
services:
  l4-planner:
    image: l4-planner:latest
    container_name: l4-planner
    network_mode: host
    cpuset: "8-11"
    restart: "no"
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      # SUPER starts only when ENABLE_SUPER=true (owner, 2026-10-29: off until SUPER is ready).
      # Start it later in the running container with:
      #   docker exec -d l4-planner /entrypoint.sh roslaunch l4_bringup super.launch
      - ENABLE_SUPER=${ENABLE_SUPER:-false}
      # the mission executive starts only with a mission file (D6, fc frame; a path inside the container)
      - MISSION=${MISSION:-}
    # l4_planner.launch (l4_bringup): planner bridge (speed cap 0.5, D10), track planner, landing check,
    # mission executive (with MISSION), SUPER (with ENABLE_SUPER=true). None of them arms (D5).
    command: >
      bash -c "roslaunch l4_bringup l4_planner.launch enable_super:=$$ENABLE_SUPER speed_cap:=0.5 mission:=$$MISSION"
