      closure 2.69m, RSS FLAT ~64MB (was 3.7GB). Runs at rate 0.5 (compute-bound ~0.5x realtime on
      8GB Jetson) so the node keeps pace and the cap never fires. CAVEAT: if the cap DOES fire (rate
      1.0, node falls behind), dropped scans break CT-ICP's const-velocity model -> divergence
      (max_step 120m). So realtime/live needs faster HW, lower lidar rate, or more compute cuts."
    - "RATE 1.0 RE-TESTED w/ full reduced-compute config (iter5/resid800/voxel0.8): node AVERAGES
