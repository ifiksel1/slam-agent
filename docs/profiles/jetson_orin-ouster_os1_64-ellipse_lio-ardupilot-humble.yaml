fingerprint: "jetson_orin-ouster_os1_64-ellipse_lio-ardupilot-humble"
date: "2026-06-08"
source: "curated"
description: "Jetson Orin NX with Ouster OS1-64 running EllipseLIO (adaptive ellipsoid LIO) on ArduPilot. Candidate replacement for FAST-LIO2 in confined/feature-poor spaces."

hardware:
  platform:
    type: jetson
    model: orin_nx
    ram_gb: 8           # 7.65 GB usable — comfortable for EllipseLIO (4GB floor)
    cpu_cores: 6
    carrier: "CTI Hadron Dual MIPI"
    gpu: "Ampere (not required — EllipseLIO is CPU-only, no CUDA)"
    os: "Ubuntu 20.04 (focal) — host has ROS Noetic only; NO native Humble. ROS 2 via Docker."
  lidar:
    model: ouster_os1_64
    channels: 64
    interface: ethernet
    default_ip: "192.168.1.2"
    points_per_second: 1310720
    has_imu: true
    imu_model: ICM-20948
  camera: null
  imu_source: lidar
  flight_controller:
    model: cube_orange
    firmware: ardupilot
    version: "4.5"
    telemetry_port: "/dev/ttyTHS1"
    telemetry_baud: 921600
  communication: mavros
  ros_version: humble
  slam_algorithm: ellipse_lio

phase1_config:
  workspace_path: "~/colcon_ws"
  ros_version: "ROS2"
  ros_distro: "humble"          # also builds on Jazzy (CMake auto-detects via ROS_JAZZY)
  slam_algorithm: "ellipse_lio"
  repo_url: "https://github.com/v4rl-ucy/ellipselio"
  package_name: "ellipselio"
  lidar:
    type: "ouster"
    model: "os1-64"
    topic: "/ouster/points"
    imu_topic: "/ouster/imu"
  imu_source: "lidar"
  flight_controller:
    type: "ardupilot"
    connection: "serial"
    port: "/dev/ttyTHS1"
    baud: 921600
  communication: "mavros"
  transforms:
    base_to_lidar:
      x: 0.0
      y: 0.0
      z: 0.10
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  docker: true          # host is Ubuntu 20.04 (Noetic only); Humble via container. Jazzy alt needs 24.04.

slam_io:
  config_template: "config/os1_64_ouster.yaml (single nested params file)"
  odom_topic: "/ellipselio_odom"          # nav_msgs/Odometry, IMU rate (~79Hz) -> vision_to_mavros. BEST_EFFORT QoS — a RELIABLE subscriber gets ZERO msgs.
  tf_chain: "/odom_ellipselio -> /imu_prop_ellipselio (low-latency) / /imu_ellipselio (corrected). NOTE leading slash (hardcoded map_processing.cpp) breaks static_transform_publisher view frames."
  bridge: "vision_to_mavros (nav_msgs/Odometry in). MUST NEGATE YAW: physical CCW reads as yaw DECREASE (inverted sign, same as SuperOdom)."
  tune_critical: "lidar.vertical_fov=42.4 for OS64; map_resolution 0.2 (0.1 starves features -> runaway); lidar.rate=20 MUST match real scan Hz (not dataset 10)"

build_notes:
  - "ROS 2 ONLY — no Noetic. colcon build --packages-select ellipselio --cmake-args -DCMAKE_BUILD_TYPE=Release --symlink-install"
  - "Vendored IKFoM + i-Octree in include/ — NO GTSAM/Ceres/Sophus needed (lighter than SuperOdom/LIO-SAM)"
  - "Requires libomp-dev (-fopenmp throughout). OpenCV only used on camera path"
  - "Jetson aarch64: if EKF diverges, override -Ofast -> -O3. PCL_NO_PRECOMPILE makes builds slow — limit -j on 8GB"
  - "use_sim_time:=false mandatory for live sensors (default true = bag playback)"

validated: true            # bench + live motion validated 2026-06-21 on the real rig
integration_complete: false  # flight (vision_to_mavros + MAVROS) not yet flown; needs flight-scale loop
notes: |
  Newly added 2026-06-08; bench+bag tuned 2026-06-11 (EllipseLIO won the 3-way apartment
  benchmark: 0.01m loop closure, smoothest per-scan, no divergence — at BOOST clock).
  PHASE 5 LIVE VALIDATED 2026-06-21 (boost 1984MHz, CycloneDDS): live Ouster driver +
  EllipseLIO co-run, /ouster/points 20.02Hz steady, /ellipselio_odom ~79Hz single publisher.
  Hand-carried motion test #2 (translate + 90 CCW then 90 CW, return to origin):
  loop closure 0.02m, max single-step 0.01m (zero divergence), yaw drift -3.2deg, no terminal
  runaway. YAW SIGN INVERTED: physical CCW reads as yaw DECREASE (~-90.6deg for a 90 turn) ->
  vision_to_mavros must negate yaw (same as SuperOdom). Magnitude accurate.
  REMAINING for integration_complete: flight-scale walking loop (this was a ~1m handheld
  envelope), then vision_to_mavros (negate yaw + world-Z/heading) + GPS-denied flight.
  Requires CLOCK BOOST (compute-marginal/diverges ~50% at stock 1497MHz) and CycloneDDS."
