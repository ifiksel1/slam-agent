fingerprint: "jetson_orin-ouster_os1_64-ellipse_lio-ardupilot-humble"
date: "2026-06-08"
source: "curated"
description: "Jetson Orin NX with Ouster OS1-64 running EllipseLIO (adaptive ellipsoid LIO) on ArduPilot. Candidate replacement for FAST-LIO2 in confined/feature-poor spaces."

hardware:
  platform:
    type: jetson
    model: orin_nx
    ram_gb: 16
    cpu_cores: 8
    gpu: "Ampere (not required — EllipseLIO is CPU-only, no CUDA)"
    os: "Ubuntu 22.04 (JetPack 6.0)"
  lidar:
    model: ouster_os1_64
    channels: 64
    interface: ethernet
    default_ip: "192.168.1.2"
    points_per_second: 1310720
    has_imu: true
    imu_model: ICM-20948
  camera: null
  imu_source: lidar
  flight_controller:
    model: cube_orange
    firmware: ardupilot
    version: "4.5"
    telemetry_port: "/dev/ttyTHS1"
    telemetry_baud: 921600
  communication: mavros
  ros_version: humble
  slam_algorithm: ellipse_lio

phase1_config:
  workspace_path: "~/colcon_ws"
  ros_version: "ROS2"
  ros_distro: "humble"          # also builds on Jazzy (CMake auto-detects via ROS_JAZZY)
  slam_algorithm: "ellipse_lio"
  repo_url: "https://github.com/v4rl-ucy/ellipselio"
  package_name: "ellipselio"
  lidar:
    type: "ouster"
    model: "os1-64"
    topic: "/ouster/points"
    imu_topic: "/ouster/imu"
  imu_source: "lidar"
  flight_controller:
    type: "ardupilot"
    connection: "serial"
    port: "/dev/ttyTHS1"
    baud: 921600
  communication: "mavros"
  transforms:
    base_to_lidar:
      x: 0.0
      y: 0.0
      z: 0.10
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
  docker: false

slam_io:
  config_template: "config/os1_64_ouster.yaml (single nested params file)"
  odom_topic: "/ellipselio_odom"          # nav_msgs/Odometry, IMU rate -> vision_to_mavros
  tf_chain: "odom_ellipselio -> imu_prop_ellipselio (low-latency) / imu_ellipselio (corrected)"
  bridge: "vision_to_mavros (nav_msgs/Odometry in)"
  tune_critical: "lidar.vertical_fov=42.4 for OS64; map_resolution floor 0.1"

build_notes:
  - "ROS 2 ONLY — no Noetic. colcon build --packages-select ellipselio --cmake-args -DCMAKE_BUILD_TYPE=Release --symlink-install"
  - "Vendored IKFoM + i-Octree in include/ — NO GTSAM/Ceres/Sophus needed (lighter than SuperOdom/LIO-SAM)"
  - "Requires libomp-dev (-fopenmp throughout). OpenCV only used on camera path"
  - "Jetson aarch64: if EKF diverges, override -Ofast -> -O3. PCL_NO_PRECOMPILE makes builds slow — limit -j on 8GB"
  - "use_sim_time:=false mandatory for live sensors (default true = bag playback)"

validated: false
integration_complete: false
notes: "Newly added framework (2026-06-08). Configs/scripts staged but NOT yet bench/flight-tested on this rig. Run Phase 2 validation + Phase 5 testing before trusting. EllipseLIO is claimed superior to FAST-LIO2 in confined spaces via adaptive ellipsoid (tensor-voting) residuals."
