/**:
    ros__parameters:

        mapping:
            # TUNED 0.1->0.2 (2026-06-11): the 0.1 floor was FINER than FAST-LIO (0.5) and
            # SuperOdom (0.2) and FRAGMENTED features at feature-poor spots -> tensor-voting
            # collapse (feats<50, obs_score<0.5) -> IMU runaway. 0.2 fixes the terminal runaway
            # on the apartment bag (loop 0.00m @ boost, 2/2) AND cuts RAM. Pairs with CPU boost
            # (1984MHz): at stock 1497 it's compute-marginal and the runaway recurs ~50% of runs.
            map_resolution: 0.2
            pub_map_n_secs: 10

        lidar:
            type: 3                  # LIVOX=1, VELODYNE=2, OUSTER=3, HESAI=4
            rate: 20                 # THIS RIG RUNS 20Hz (1024x20). NCD configs use 10 — a 2x error
                                     # here mis-associates IMU<->LiDAR (match_idx=floor(dt*rate)) and
                                     # breaks deskew (scan_time=1/rate) -> EKF runs away under motion.
            scan_lines: 64
            vertical_fov: 42.4       # TUNE-CRITICAL for OS1-64; wrong value silently degrades accuracy
            min_range: 0.3          # TUNED 0.5->0.3: recover near structure at sparse spots (SuperOdom uses 0.2)
            max_range: 80.0         # TUNED 100->80: drop spurious far matches (rng_mean spiked to 400m at starvation)
            topic: "/ouster/points"  # live Ouster ROS2 driver (was /os1_cloud_node/points for NCD bags)
            # Extrinsic for THIS rig (OS1-64 built-in ICM-20948, IMU yaw-flipped vs LiDAR).
            # Matches the validated SuperOdom/FAST-LIO calibration on this drone.
            t_imu_lidar: [-0.006253, 0.011775, 0.028535]
            r_imu_lidar: [-1.,  0.,  0.,
                           0., -1.,  0.,
                           0.,  0.,  1.]

        imu:
            rate: 100
            acc_noise: 0.001249
            gyr_noise: 0.000208
            acc_bias: 0.000106
            gyr_bias: 0.000004
            topic: "/ouster/imu"     # live Ouster ROS2 driver (was /os1_cloud_node/imu for NCD bags)
