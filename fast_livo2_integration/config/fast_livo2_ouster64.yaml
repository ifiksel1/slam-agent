# FAST-LIVO2 — Ouster OS1-64 on Dragunfly (Jetson Orin NX 8GB / CubeOrange / ArduPilot)
# Generated by SLAM Integration Agent — Phase 3 (2026-06-06)
# Reconciled against real FAST-LIVO2 repo — Phase 4 (2026-06-06)
# Profile: jetson_orin_nx_8gb-ouster_os1_64-fast_livo2-ardupilot-noetic
# MODE: LiDAR-inertial-only (img_en=0). Vision drops in when the camera arrives.

common:
    img_topic: "/camera/image_raw"   # placeholder — UNUSED while img_en=0
    lid_topic: "/ouster/points"
    imu_topic: "/ouster/imu"
    img_en: 0                         # <<< VISION DISABLED (camera deferred)
    lidar_en: 1
    ros_driver_bug_fix: false

extrin_calib:
    # LiDAR(os_lidar) -> IMU(os_imu) extrinsic.
    # Computed from Ouster OS1-64 metadata (SN 122224003549, fw v2.4.0):
    #   lidar_to_sensor: R=[[-1,0,0],[0,-1,0],[0,0,1]] T=[0,0,36.18mm]
    #   imu_to_sensor:   R=I                           T=[6.253,-11.775,7.645mm]
    #   lidar_to_imu = inv(imu_to_sensor) * lidar_to_sensor
    #     => R=[[-1,0,0],[0,-1,0],[0,0,1]]  T=[-6.253,11.775,28.535mm] -> meters below
    extrinsic_T: [-0.006253, 0.011775, 0.028535]
    extrinsic_R: [-1, 0, 0,
                   0,-1, 0,
                   0, 0, 1]
    # Camera -> LiDAR — UNUSED while img_en=0. Kalibr-calibrate when camera arrives.
    Rcl: [1, 0, 0,
          0, 1, 0,
          0, 0, 1]
    Pcl: [0.0, 0.0, 0.0]

time_offset:
    lidar_time_offset: 0.0    # Ouster hardware timestamps; no compensation needed
    imu_time_offset: 0.0
    img_time_offset: 0.0
    exposure_time_init: 0.0

preprocess:
    point_filter_num: 4      # 8GB Orin NX @ up to 10 m/s — matched-filter tuning (learned lesson)
    filter_size_surf: 0.5    # learned: pairs w/ point_filter_num:4 → 1024x20 @ 20Hz, no drops
    lidar_type: 3            # 3 = Ouster
    scan_line: 64
    blind: 1.0               # clear airframe/props (was 4.0 outdoor; reduced for indoor hangar)

vio:                          # inactive while img_en=0 — retained for camera drop-in
    max_iterations: 5
    outlier_threshold: 1000
    img_point_cov: 100
    patch_size: 8
    patch_pyrimid_level: 3   # reconciled: NTU_VIRAL uses 3, not 4
    normal_en: true
    raycast_en: false
    inverse_composition_en: false
    exposure_estimate_en: true
    inv_expo_cov: 0.1

imu:
    imu_en: true
    imu_int_frame: 30
    acc_cov: 0.5
    gyr_cov: 0.3
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001

lio:
    max_iterations: 5
    dept_err: 0.02
    beam_err: 0.05
    min_eigen_value: 0.0025
    voxel_size: 0.5
    max_layer: 2
    max_points_num: 50
    layer_init_num: [5, 5, 5, 5, 5]

local_map:
    map_sliding_en: true     # 40-min flight on 8GB — bound RAM with a sliding local map
    half_map_size: 100
    sliding_thresh: 8

uav:
    imu_rate_odom: false
    gravity_align_en: true   # gravity-align world: required for upside-down IMU + ENU vision_pose

publish:
    dense_map_en: false      # 8GB perf — no colored dense map (no camera anyway)
    pub_effect_point_en: false
    pub_plane_en: false
    pub_scan_num: 1
    blind_rgb_points: 0.0

evo:
    seq_name: "dragunfly_fast_livo2"
    pose_output_en: false

pcd_save:
    pcd_save_en: false
    type: 0
    colmap_output_en: false
    filter_size_pcd: 0.15
    interval: -1

image_save:
    img_save_en: false
    interval: 1
