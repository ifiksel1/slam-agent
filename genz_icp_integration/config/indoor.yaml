# STOCK upstream indoor.yaml, byte-for-byte on the values. Used for the 3rd_floor
# reference bag so the comparison against BIEVR-LIO / COIN-LIO / EllipseLIO measures
# the paper's own default behavior, with zero tuning of ours.
deskew: false
max_range: 100.0
min_range: 0.3
voxel_size: 0.3
desired_num_voxelized_points: 2000
planarity_threshold: 0.2
max_points_per_voxel: 1
initial_threshold: 2.0
min_motion_th: 0.1
max_num_iterations: 100
convergence_criterion: 0.0001
