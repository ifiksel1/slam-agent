# Pinned upstream sources for docker_src/.
#
# scripts/fetch_docker_sources.sh clones these and checks out the recorded commit,
# then scripts/apply_overrides.sh copies overrides/ over the top. Together those two
# steps reproduce docker_src/ exactly, which matters because docker_src/ is
# .gitignored and therefore exists on no other machine.
#
# To move to a newer upstream: update the sha here, re-run fetch, re-run
# `apply_overrides.sh apply`, then rebuild and re-test. Expect conflicts in
# laserMapping.cpp — our version is a whole-file override, not a patch.

