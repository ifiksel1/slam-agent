# CAN USA warehouse 2026-07-15 flight 20:34:50 map: out and back across the open floor (sim mission A, 5 of 5)
# Converted 2026-10-27 from the MARSIM waypoint file, which is in the planner frame. In simulation the
# anchor at the start is the identity (planner = fc), so the coordinates are unchanged; on the robot,
# write waypoints in the FC's EKF frame (MAVROS local ENU) and the executive converts them (D7).
# map canusa_2034.pcd; start 0.00, 0.00, 1.50 (x, y, height).
name: example_canusa_A_inside
frame: fc
takeoff_height: 1.50      # m above the liftoff point (NAV_TAKEOFF)
defaults:
  speed: 1.0            # m/s, a cap the bridge applies (D10: 0.5 on the robot until Gate L4)
  accept_radius: 0.5    # m, the goal counts as reached inside this
  leg_timeout_s: 90
  no_progress_s: 20     # unreachable if not 0.2 m closer within this
legs:
  - {type: takeoff, height: 1.50}
  - {type: fly, goal: [-0.50, -1.00, 1.50]}
  - {type: fly, goal: [5.20, -4.20, 1.50]}
  - {type: fly, goal: [8.80, -3.80, 1.50]}
  - {type: fly, goal: [5.20, -4.20, 1.50]}
  - {type: fly, goal: [0.00, 0.00, 1.50]}
