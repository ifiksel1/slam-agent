# Hensel Phelps 2026-10-15 flight 21:06:50 map: fly, land, drive around the box, take off, fly back, land.
# The owner's drive-and-fly demo (L2 closed loop, 2026-10-28):
#   take off at the real takeoff spot, fly south down the east side (4 legs), land on the open floor
#   at (-6.00, -9.00) (the rendered map reads it clear from every side, cl22), drive east past the south
#   side of the ~1.2 x 1 m box at (-2.6, -7.6) to (-1.70, -8.60) with the track planner (4.3 m), take
#   off there, fly
#   back north and land at (-0.20, -3.20) (not the takeoff spot, whose floor the robot's own body hides
#   from the landing check; not (-0.60, -2.60), 0.4 m from a 0.58 m spike in the map at (-0.4, -2.2):
#   the frame-centred disc takes it in and the check refused it, cl32). The drive stays west of map x ~ -1, where the
#   merged map's floor steps up 0.2-0.3 m (it reads as a wall to the track planner in SITL, cl31; a goal
#   behind the box at (-1.30, -7.20) lies against that step and found no path in 90 s, cl34). The
#   drive passes the box's south side. (-5.00, -8.20) read clear in cl32-cl34 but was refused in cl35:
#   the check's disc is centred on the frame, 0.193 m behind the spot along the arrival heading, and
#   at the heading SUPER arrived with in cl35 it took in 0.09-0.11 m bumps of the map west of the spot.
# Waypoints in the map frame = fc in simulation (identity anchor at the start); on the robot, write
# them in the FC's EKF frame (MAVROS local ENU) and the executive converts them (D7).
# map hp_1015_carved.pcd; start 0.00, 0.00, yaw -90.7 (x, y, deg): the real takeoff spot.
name: example_hp_drive_fly
frame: fc
takeoff_height: 1.00      # m above the liftoff point (NAV_TAKEOFF)
defaults:
  speed: 1.0            # m/s, a cap the bridge applies (D10: 0.5 on the robot until Gate L4)
  accept_radius: 0.5    # m, the goal counts as reached inside this
  leg_timeout_s: 90
  no_progress_s: 20     # unreachable if not 0.2 m closer within this
  on_unreachable: stop
legs:
  - {type: takeoff, height: 1.00}
  - {type: fly, goal: [0.16, -1.92, 1.30]}
  - {type: fly, goal: [0.11, -4.46, 1.30]}
  - {type: fly, goal: [-0.28, -7.61, 1.30]}
  - {type: fly, goal: [-2.29, -9.57, 1.30]}
  - {type: land, at: [-6.00, -9.00]}            # fly over it, landing check, NAV_LAND (stays armed, GUIDED)
  - {type: drive, goal: [-1.70, -8.60], speed: 0.5, accept_radius: 0.4}   # past the box, track planner
  - {type: takeoff, height: 1.30}               # NAV_TAKEOFF from where it drove to
  - {type: fly, goal: [0.11, -4.46, 1.30]}
  - {type: fly, goal: [0.16, -1.92, 1.30]}
  - {type: land, at: [-0.20, -3.20]}            # landing check, NAV_LAND
