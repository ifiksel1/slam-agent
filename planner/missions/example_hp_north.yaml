# Hensel Phelps 2026-10-15: north up the west corridor to y ~9 (sim mission 3, 5 of 5)
# Converted 2026-10-27 from the MARSIM waypoint file, which is in the planner frame. In simulation the
# anchor at the start is the identity (planner = fc), so the coordinates are unchanged; on the robot,
# write waypoints in the FC's EKF frame (MAVROS local ENU) and the executive converts them (D7).
# map hp_1015_carved.pcd; the sim starts airborne at (-5.70, -8.40, 1.20), on the open floor; start -5.70, -8.40, 1.20 (x, y, height).
name: example_hp_north
frame: fc
takeoff_height: 1.20      # m above the liftoff point (NAV_TAKEOFF)
defaults:
  speed: 1.0            # m/s, a cap the bridge applies (D10: 0.5 on the robot until Gate L4)
  accept_radius: 0.5    # m, the goal counts as reached inside this
  leg_timeout_s: 90
  no_progress_s: 20     # unreachable if not 0.2 m closer within this
legs:
  - {type: takeoff, height: 1.20}
  - {type: fly, goal: [-8.30, -4.00, 1.20]}
  - {type: fly, goal: [-8.60, 2.00, 1.20]}
  - {type: fly, goal: [-7.85, 8.56, 1.20]}
  - {type: fly, goal: [-4.00, 10.00, 1.20]}
  - {type: fly, goal: [1.00, 8.50, 1.20]}
