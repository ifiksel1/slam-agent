/**:
  ros__parameters:
    imu_topic: "/ouster/imu"
    laser_topic: "/ouster/points"
    sensor: "ouster"
    use_imu_roll_pitch: true
    save_ply: false   # This can affect real-time performance; make sure you have enough memory for saving point cloud

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "sensor"
    sensor_frame_rot: "sensor_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    # Feature Extraction Params
    feature_extraction_node:
        scan_line: 64       # Ouster OS1-64 (was 128 on os1_128.yaml)
        min_range: 0.2      #<!-- remove too closed points -->
        filter_point_size: 4   # TUNED 3->4 (2026-06-11): SuperOdom's nondeterministic transient
                               # scales with per-scan compute (apartment max-step: heavy iter8/surf3000=60m,
                               # baseline=20m, this lighter config=~10m). More downsampling -> more real-time
                               # margin -> smaller transient. Loop closure unchanged (0.19m).

    # Laser Mapping Params
    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.2
        max_iterations: 5
        max_surface_features: 1500   # TUNED 2000->1500: fewer surface constraints -> lighter per-scan
                                     # compute -> smaller transient (see filter_point_size note). Transient
                                     # NOT eliminated -> external kinematic gate on /state_estimation stays mandatory.

        # For localization mode
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0

    # IMU Preintegration Params
    imu_preintegration_node:
        lidar_correction_noise: 0.01

        acc_n: 3.9939570888238808e-03          # accelerometer measurement noise standard deviation. #0.2
        gyr_n: 1.5636343949698187e-03         # gyroscope measurement noise standard deviation.     #0.05
        acc_w: 6.4356659353532566e-05          # accelerometer bias random work noise standard deviation.  #0.02
        gyr_w: 3.5640318696367613e-05       # gyroscope bias random work noise standard deviation.     #4.0e-5
        g_norm: 9.80511    # 0 means you need to provide both imu-camera and laser-camera extrinsic
